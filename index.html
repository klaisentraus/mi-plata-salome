   ========================================================================= */
function paqueteJSON(){
  var copia=JSON.parse(JSON.stringify(S));
  Object.keys(copia).forEach(function(k){ if(k.charAt(0)==='_') delete copia[k]; });
  copia.exportado=new Date().toISOString();
  return JSON.stringify(copia);
}
function nombreArchivo(ext){
  var d=new Date();
  return 'MiPlata-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.'+ext;
}
function marcarRespaldo(){
  S.ajustes.ultimoRespaldo=new Date().toISOString();
  S.ajustes.movsDesdeRespaldo=0; guardar(); pintar();
}
function bajar(txt, nombre, tipo){
  try{
    var b=new Blob([txt],{type:tipo||'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },1200);
    return true;
  }catch(e){ return false; }
}
function respaldarArchivo(){
  if(bajar(paqueteJSON(), nombreArchivo('json'))){ marcarRespaldo(); toast('Copia descargada ✓'); }
  else toast('No se pudo descargar. Usa «Copiar».');
}
function respaldarCompartir(){
  var txt=paqueteJSON();
  var hecho=false;
  try{
    var f=new File([txt], nombreArchivo('json'), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:'Copia de Mi Plata'})
        .then(function(){ marcarRespaldo(); toast('Copia enviada ✓'); })
        .catch(function(){});
      hecho=true;
    }
  }catch(e){}
  if(!hecho && navigator.share){
    navigator.share({title:'Copia de Mi Plata', text:txt})
      .then(function(){ marcarRespaldo(); toast('Copia enviada ✓'); })
      .catch(function(){});
    hecho=true;
  }
  if(!hecho){
    respaldarCopiar();
    toast('Copiado. Pégalo en un chat contigo misma.');
  }
}
function respaldarCopiar(){
  var txt=paqueteJSON();
  function ok(){ marcarRespaldo(); toast('Copia en el portapapeles ✓'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){ copiarViejo(txt,ok); });
  }else copiarViejo(txt,ok);
}
function copiarViejo(txt,ok){
  var t=document.createElement('textarea'); t.value=txt;
  t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t);
  t.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(t);
}
function exportarApp(){
  var abre='<script id="seed" type="application/json">';
  var i=HTML_ORIGINAL.indexOf(abre);
  if(i<0){ toast('No se pudo generar el archivo'); return; }
  var j=HTML_ORIGINAL.indexOf('<'+'/script>', i);
  if(j<0){ toast('No se pudo generar el archivo'); return; }
  var datos=paqueteJSON().replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var html='<!doctype html>\n'+HTML_ORIGINAL.slice(0,i+abre.length)+datos+HTML_ORIGINAL.slice(j);
  if(bajar(html, nombreArchivo('html'), 'text/html')){
    marcarRespaldo();
    toast('Listo. Guárdalo en Drive o mándatelo.');
  }else toast('No se pudo descargar el archivo');
}
function aplicarRestaurado(o){
  if(!o || Object.prototype.toString.call(o.mov)!=='[object Array]'){ toast('Ese archivo no parece una copia válida'); return; }
  if(!o.mov.length && !confirm('Esa copia no tiene movimientos. ¿Restaurar de todos modos?')) return;
  if(S.mov.length && !confirm('Vas a reemplazar '+S.mov.length+' movimiento(s) de este dispositivo por '+o.mov.length+' de la copia. ¿Seguir?')) return;
  var base=estadoNuevo();
  S={ v:1, updatedAt:new Date().toISOString(),
      perfil:Object.assign(base.perfil, o.perfil||{}),
      mov:o.mov||[], metas:o.metas||[], deudas:o.deudas||[], fijos:o.fijos||[],
      ajustes:Object.assign(base.ajustes, o.ajustes||{}) };
  guardar(); aplicarTema(); ir('inicio');
  toast('Datos restaurados ✓ ('+S.mov.length+' movimientos)');
}
function restaurarArchivo(inp){
  var f=inp.files && inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ aplicarRestaurado(JSON.parse(String(r.result))); }
    catch(e){ toast('No pude leer ese archivo'); }
    inp.value='';
  };
  r.onerror=function(){ toast('No pude leer ese archivo'); };
  r.readAsText(f);
}
function restaurarTexto(){
  var t=(document.getElementById('pegaTxt')||{}).value||'';
  if(!t.trim()){ toast('Pega primero el texto de la copia'); return; }
  try{ aplicarRestaurado(JSON.parse(t.trim())); }
  catch(e){ toast('Ese texto no es una copia válida'); }
}
function borrarTodo(){
  if(!confirm('¿Seguro? Se borra todo lo que has registrado en este dispositivo.')) return;
  if(!confirm('Última confirmación. ¿Tienes una copia guardada? Esto no se puede deshacer.')) return;
  S=estadoNuevo(); guardar(); ir('inicio'); toast('Todo borrado');

function sheet(titulo, html){
  document.getElementById('sheetBody').innerHTML =
    (titulo?'<h2 style="margin-bottom:14px">'+esc(titulo)+'</h2>':'')+html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.body.style.overflow='hidden';
}
/* la barrita de arriba: un toque cierra, y también se puede arrastrar la ficha hacia abajo */
var ARR={activo:false, y0:0, t0:0, dy:0};
function arrIni(y){
  ARR.activo=true; ARR.y0=y; ARR.t0=Date.now(); ARR.dy=0;
  document.getElementById('sheet').style.transition='none';
}
function arrMueve(y){
  if(!ARR.activo) return;
  ARR.dy=Math.max(0, y-ARR.y0);
  document.getElementById('sheet').style.transform='translateY('+ARR.dy+'px)';
}
function arrFin(){
  if(!ARR.activo) return;
  ARR.activo=false;
  var sh=document.getElementById('sheet');
  sh.style.transition=''; sh.style.transform='';
  /* un toque cierra; un arrastre cierra si bajó bastante o si fue un tirón rápido */
  var tiron=(Date.now()-ARR.t0)<300 && ARR.dy>24;
  if(ARR.dy<6 || ARR.dy>90 || tiron) cerrarSheet();
}
function montarArrastre(){
  var cab=document.getElementById('sheetCab'); if(!cab) return;
  cab.addEventListener('touchstart', function(e){ arrIni(e.touches[0].clientY); }, {passive:true});
  cab.addEventListener('touchmove', function(e){
    arrMueve(e.touches[0].clientY); if(e.cancelable) e.preventDefault();
  }, {passive:false});
  cab.addEventListener('touchend', arrFin);
  cab.addEventListener('touchcancel', arrFin);
  cab.addEventListener('mousedown', function(e){ arrIni(e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', function(e){ if(ARR.activo) arrMueve(e.clientY); });
  window.addEventListener('mouseup', function(){ if(ARR.activo) arrFin(); });
  cab.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' ') { e.preventDefault(); cerrarSheet(); }
  });
}

function cerrarSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  document.body.style.overflow='';
}

/* =========================================================================
   PAGOS CON FECHA — cuotas de deuda y gastos fijos que vencen
   ========================================================================= */
function fechaDe(ym,dia){ return ym+'-'+pad(Math.min(Math.max(1,dia||1), diasEnMes(ym))); }
/* el mes en que cae la cuota k de una deuda a plazos (k=0 es la primera) */
function mesCuota(desde, k){
  var y=+desde.slice(0,4), m=+desde.slice(5,7)-1+k;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  return y+'-'+pad(m+1);
}
/* cuántas cuotas lleva pagadas y cuál sigue (-1 si ya no queda ninguna) */
function estadoCuotas(d){
  var pagadas=0, sig=-1;
  for(var k=0;k<(d.n||0);k++){
    if(pagoDe(d.id, mesCuota(d.fecha,k))) pagadas++;
    else if(sig<0) sig=k;
  }
  return {pagadas:pagadas, sig:sig};
}
function deudaDe(id){ return S.deudas.filter(function(d){ return d.id===id; })[0]; }

/* el movimiento que salda ese compromiso en ese mes, si existe */
function pagoDe(id,ym){
  var r=null;
  S.mov.forEach(function(m){ if(m.ref===id && m.refMes===ym) r=m; });
  return r;
}

function compromisos(ym){
  var hoyD=new Date().getDate(), esActual=(ym===ymHoy()), out=[];

  function agregar(o, tipoComp, cat, monto){
    if(!(monto>0)) return;
    if(o.tipo==='unica'){
      if(!o.fecha) return;
      var mesF=o.fecha.slice(0,7);
      /* aparece en su mes; y si ya pasó y sigue sin pagar, se arrastra al mes
         actual para que no se le olvide */
      if(mesF!==ym && !(esActual && mesF<ym && !pagoDe(o.id,mesF))) return;
      out.push({id:o.id, nombre:o.nombre, monto:monto, tipo:tipoComp, cat:cat,
                unica:true, fecha:o.fecha, mesRef:mesF, dia:+o.fecha.slice(8,10)});
    }else{
      if(!(o.dia>0)) return;
      out.push({id:o.id, nombre:o.nombre, monto:monto, tipo:tipoComp, cat:cat,
                unica:false, fecha:fechaDe(ym,o.dia), mesRef:ym, dia:o.dia});
    }
  }
  S.deudas.forEach(function(d){
    if((d.saldo||0)<=0) return;             /* ya está pagada: no vuelve a pedir plata */
    if(d.tipo==='cuotas'){
      if(!d.fecha || !(d.n>0)) return;
      var dia=+d.fecha.slice(8,10);
      for(var k=0;k<d.n;k++){
        var mes=mesCuota(d.fecha,k);
        /* cada cuota vive en su mes; si se pasó y sigue sin pagar, se arrastra
           al mes actual para que no se le pierda */
        if(mes!==ym && !(esActual && mes<ym && !pagoDe(d.id,mes))) continue;
        var mo=Math.min(d.cuota||0, d.saldo||0);
        if(!(mo>0)) continue;
        out.push({id:d.id, nombre:d.nombre, monto:mo, tipo:'deuda', cat:'deudas',
                  unica:false, cuotaN:k+1, cuotasTot:d.n,
                  fecha:fechaDe(mes,dia), mesRef:mes, dia:dia});
      }
      return;
    }
    /* pago único: lo que debe pagar es todo lo que debe; así se ajusta solo
       después de un abono parcial */
    agregar(d,'deuda','deudas', d.tipo==='unica' ? (d.saldo||0) : (d.cuota||0));
  });
  S.fijos.forEach(function(f){ agregar(f,'fijo',f.cat||'otros_out',f.monto); });

  var hoy0=new Date(); hoy0.setHours(0,0,0,0);
  out.forEach(function(c){
    var mv=pagoDe(c.id,c.mesRef);
    c.pagado=!!mv; c.mov=mv;
    var p=c.fecha.split('-');
    c.dias=Math.round((new Date(+p[0],+p[1]-1,+p[2]) - hoy0)/86400000);
    if(c.pagado)            c.estado='pagado';
    else if(c.mesRef<ymHoy()) c.estado='vencido';
    else if(c.mesRef>ymHoy()) c.estado='futuro';
    else if(c.dias<0)       c.estado='vencido';
    else if(c.dias<=5)      c.estado='proximo';
    else                    c.estado='pendiente';
  });
  out.sort(function(a,b){ return (a.pagado?1:0)-(b.pagado?1:0) || a.fecha.localeCompare(b.fecha); });
  return out;
}

/* ¿me alcanza para lo que viene? */
function prevision(ym){
  ym=ym||ymHoy();
  var lista=compromisos(ym);
  var pend=lista.filter(function(c){ return !c.pagado; });
  var porPagar=pend.reduce(function(a,c){ return a+c.monto; },0);
  var r=resumen(ym);
  /* si ya configuro su saldo, lo que tiene de verdad; si no, solo el neto del mes */
  var sa=saldoActual();
  var yaTengo=(sa===null) ? (r.ing-r.gas-r.aho) : sa;
  /* al principio del mes el sueldo aún no ha caído: contarlo evita la falsa alarma */
  var refIng=S.perfil.ingresoEsperado || base().ing || 0;
  var porEntrar=Math.max(0, refIng-r.ing);
  var disponible=yaTengo+porEntrar;
  var hoyD=new Date().getDate();
  var prox=pend.length ? pend.slice().sort(function(a,b){ return a.dia-b.dia; })[0] : null;
  var dias=prox ? Math.max(1, prox.dia-hoyD) : 0;
  var falta=porPagar-disponible;
  return {lista:lista, pend:pend, porPagar:porPagar, disponible:disponible, falta:falta,
          yaTengo:yaTengo, porEntrar:porEntrar,
          prox:prox, dias:dias, porDia:(falta>0&&dias>0)?falta/dias:0,
          vencidos:pend.filter(function(c){ return c.estado==='vencido'; })};
}

/* dónde recortar para llegar: las categorías no esenciales más grandes */
function dondeRecortar(ym){
  var r=resumen(ym), top=[];
  Object.keys(r.porCat).forEach(function(k){
    var c=CAT_MAP[k]; if(c && !c.ess) top.push({c:c, v:r.porCat[k]});
  });
  top.sort(function(a,b){ return b.v-a.v; });
  return top.slice(0,3);
}

function compHTML(c, ym){
  var col = c.pagado ? 'var(--accent)'
          : c.estado==='vencido' ? 'var(--out)'
          : c.estado==='proximo' ? 'var(--warn)' : 'var(--muted)';
  var mesN=MESES[+c.fecha.split('-')[1]-1];
  var cuando = c.unica ? ('el '+c.dia+' de '+mesN) : ('el '+c.dia);
  var etq = c.pagado ? 'Pagado'
          : c.estado==='vencido'
              ? (c.dias<0 ? 'Venció '+cuando+' · hace '+Math.abs(c.dias)+' día'+(Math.abs(c.dias)>1?'s':'')
                          : 'Quedó sin pagar')
          : c.dias===0 ? 'Vence hoy'
          : c.estado==='proximo' ? 'Vence en '+c.dias+' día'+(c.dias>1?'s':'')
          : 'Vence '+cuando;
  /* tocar el nombre abre la ficha: asi se corrige o se borra desde aqui mismo */
  var abrir = c.tipo==='deuda' ? 'editarDeuda(\''+c.id+'\')' : 'editarFijo(\''+c.id+'\')';
  return '<div class="pend'+(c.pagado?' ok':'')+'">'+
    '<div class="pd" onclick="'+abrir+'"><div class="nm">'+esc(c.nombre)+' <span class="ed">›</span></div>'+
    '<div class="dt" style="color:'+col+'">'+etq+
      (c.tipo==='deuda'
        ? (c.unica ? ' · préstamo'
          : (c.cuotasTot ? ' · cuota '+c.cuotaN+' de '+c.cuotasTot : ' · cuota'))
        : '')+'</div></div>'+
    '<div class="pa tnum">'+money(c.monto)+'</div>'+
    (c.pagado
      ? '<button class="pb done" onclick="editarMov(\''+c.mov.id+'\')" aria-label="Ver">✓</button>'
      : '<button class="pb" onclick="pagarCompromiso(\''+c.id+'\',\''+ym+'\',\''+c.mesRef+'\')">Pagar</button>')+
  '</div>';
}

/* bloque de pendientes dentro de la pantalla Movimientos */
/* todas las deudas registradas, vengan o no este mes */
function deudasHTML(){
  if(!S.deudas.length){
    return '<div class="empty"><div class="pxstage">'+pxa('sleep',1)+'</div>'+
      '<b>No tienes deudas registradas</b>'+
      '<p>Si le debes a alguien, tienes tarjeta o un crédito, agrégalo aquí y no se te olvida.</p>'+
      '<button class="btn soft mt16" onclick="editarDeuda()">Agregar una deuda</button></div>';
  }
  var vivas=S.deudas.filter(function(d){ return (d.saldo||0)>0; });
  var total=vivas.reduce(function(a,d){ return a+(d.saldo||0); },0);
  var intTot=vivas.reduce(function(a,d){ return a+interesMensual(d); },0);

  var filas=S.deudas.slice().sort(function(a,b){
    return ((b.saldo||0)>0?1:0)-((a.saldo||0)>0?1:0) || (b.tasa||0)-(a.tasa||0);
  }).map(function(d){
    var pagada=(d.saldo||0)<=0;
    var sub;
    if(pagada) sub='¡Pagada! 🐾';
    else if(d.tipo==='unica' && d.fecha){
      var p=d.fecha.split('-'), hoy0=new Date(); hoy0.setHours(0,0,0,0);
      var dd=Math.round((new Date(+p[0],+p[1]-1,+p[2])-hoy0)/86400000);
      sub='Un solo pago · '+(dd<0 ? 'venció hace '+Math.abs(dd)+' día'+(Math.abs(dd)>1?'s':'')
            : (dd===0?'vence hoy':'vence el '+(+p[2])+' de '+MESES[+p[1]-1]));
    }
    else if(d.tipo==='cuotas' && d.fecha && d.n>0){
      var ec=estadoCuotas(d);
      if(ec.sig<0) sub=d.n+' cuotas · todas pagadas';
      else{
        var fS=fechaDe(mesCuota(d.fecha,ec.sig), +d.fecha.slice(8,10)).split('-');
        sub='Cuota '+(ec.sig+1)+' de '+d.n+' · '+money(d.cuota||0)+
            ' el '+(+fS[2])+' de '+MESES[+fS[1]-1];
      }
    }
    else if(d.cuota>0 && d.dia>0) sub='Cuota '+money(d.cuota)+' el día '+d.dia;
    else sub='Sin fecha puesta · tócala para ponerle una';
    if(!pagada && (d.tasa||0)>0) sub+=' · '+String(d.tasa).replace('.',',')+'% E.A.';

    return '<div class="pend'+(pagada?' ok':'')+'">'+
      '<div class="pd" onclick="editarDeuda(\''+d.id+'\')">'+
      '<div class="nm">'+esc(d.nombre)+' <span class="ed">›</span></div>'+
      '<div class="dt" style="color:'+(pagada?'var(--accent)':((d.tasa||0)>=REF.usura?'var(--out)':'var(--muted)'))+'">'+sub+'</div></div>'+
      '<div class="pa tnum">'+money(d.saldo||0)+'</div>'+
      (pagada ? '<span class="pb done">✓</span>'
              : '<button class="pb" onclick="pagarDeuda(\''+d.id+'\')">Pagar</button>')+
    '</div>';
  }).join('');

  return '<div class="card"><div class="row"><h3 style="margin:0">Todo lo que debes</h3>'+
    '<b class="tnum" style="font-size:17px;color:'+(total>0?'var(--out)':'var(--accent)')+'">'+money(total)+'</b></div>'+
    (intTot>0
      ? '<div class="s12 faint" style="margin:4px 0 2px">Solo en intereses te cuestan '+money(intTot)+' al mes. '+
        'Págalas de mayor a menor tasa.</div>'
      : '<div class="s12 faint" style="margin:4px 0 2px">Tócalas para editarlas o borrarlas.</div>')+
    filas+
    (intTot>0
      ? '<div class="s12 faint mt12">De cada cuota que registras, Mi Plata descuenta primero los intereses '+
        'del mes y baja el saldo con el resto. Es un estimado: si vuelves a usar la tarjeta o te cobran algo '+
        'extra, el saldo real cambia. Compáralo con tu extracto de vez en cuando y corrígelo aquí.</div>'
      : '')+
    '<button class="btn ghost sm mt16" style="width:100%" onclick="editarDeuda()">+ Agregar otra deuda</button>'+
  '</div>';
}

/* abono a una deuda desde la pestaña: si es el compromiso del mes, mantiene el vínculo */
function pagarDeuda(id){
  var d=deudaDe(id); if(!d) return;
  var ym=ymHoy();
  var c=compromisos(ym).filter(function(x){ return x.id===id && !x.pagado; })[0];
  if(c){ pagarCompromiso(id, ym); return; }
  /* el saldo no incluye los intereses del mes: si sugiriéramos solo el saldo,
     ella paga lo que le dijimos y le queda un resto raro debiendo */
  var totalHoy=(d.saldo||0)+interesMensual(d);
  ADD={tipo:'out', monto:String(Math.round(d.cuota>0?Math.min(d.cuota,totalHoy):totalHoy)),
       cat:'deudas', destino:'colchon', fecha:hoyISO(), nota:d.nombre, id:null, retiro:false,
       ref:d.id, refMes:null, refNombre:d.nombre};
  renderAdd();
}

function pendMesHTML(ym){
  var c=compromisos(ym).filter(function(x){ return !x.pagado; });
  if(!c.length) return '';
  var t=c.reduce(function(a,x){ return a+x.monto; },0);
  var atras=c.filter(function(x){ return x.unica && x.mesRef<ym; }).length;
  return '<div class="card" style="border-color:var(--warn)">'+
    '<div class="row"><h3 style="margin:0;color:var(--warn)">Previsto · sin pagar</h3>'+
    '<b class="tnum" style="color:var(--warn);font-size:16px">'+money(t)+'</b></div>'+
    '<div class="s12 faint" style="margin:4px 0 2px">Todavía no salió de tu bolsillo. '+
    'Toca <b>Pagar</b> el día que lo hagas'+
    (atras?', y ojo: hay '+atras+' de un mes anterior que sigue sin pagar':'')+'.</div>'+
    c.map(function(x){ return compHTML(x, ym); }).join('')+'</div>';
}

/* registrar el pago: abre el teclado ya lleno y amarrado al compromiso */
function pagarCompromiso(id, ym, mesRef){
  var l=compromisos(ym).filter(function(x){ return x.id===id && (!mesRef || x.mesRef===mesRef); });
  var c=l.filter(function(x){ return !x.pagado; })[0] || l[0];
  if(!c) return;
  ADD={tipo:'out', monto:String(Math.round(c.monto)), cat:c.cat, destino:'colchon',
       /* si ya se venció, la plata sale hoy, no en la fecha en que debía salir */
       fecha:(c.fecha>hoyISO()?c.fecha:hoyISO()), nota:c.nombre, id:null, retiro:false,
       ref:c.id, refMes:c.mesRef, refNombre:c.nombre, refDia:c.dia, refTipo:c.tipo};
  renderAdd();
}

/* de la cuota, lo que de verdad baja la deuda (el resto son intereses) */
function abonoDe(id, monto){
  var d=deudaDe(id); if(!d) return 0;
  return Math.max(0, monto-interesMensual(d));
}
function ajustarDeuda(id, delta){
  var d=deudaDe(id); if(!d) return;
  var v=Math.max(0, (d.saldo||0)+delta);
  /* el peso no tiene centavos: sin esto quedaba una deuda «viva» de $0,40 por redondeo */
  d.saldo = v<1 ? 0 : Math.round(v);
}

/* mensual o pago unico: lo mismo sirve para una deuda y para un gasto fijo */
function segTipo(t, conCuotas){
  return '<div class="seg" id="tipoSeg">'+
    (conCuotas ? [['mensual','Cada mes'],['cuotas','En cuotas'],['unica','Un solo pago']]
               : [['mensual','Cada mes'],['unica','Un solo pago']]).map(function(x){
      return '<button data-t="'+x[0]+'" class="'+(t===x[0]?'on':'')+'" '+
             'onclick="tipoComp(\''+x[0]+'\')">'+x[1]+'</button>'; }).join('')+
  '</div>';
}
function tipoComp(t){
  var seg=document.getElementById('tipoSeg'); if(!seg) return;
  [].forEach.call(seg.querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-t')===t);
  });
  var m=document.getElementById('campoMensual'), u=document.getElementById('campoUnica'),
      q=document.getElementById('campoCuotas');
  if(m) m.hidden = (t!=='mensual');
  if(u) u.hidden = (t!=='unica');
  if(q) q.hidden = (t!=='cuotas');
  calcCuota();
}
/* muestra de cuánto queda cada cuota mientras ella escribe */
function calcCuota(){
  var av=document.getElementById('avisoCuota'); if(!av) return;
  var sal=unfmt((document.getElementById('dSal')||{}).value||0);
  var n=parseInt(String((document.getElementById('dN')||{}).value||'').replace(/[^\d]/g,''),10)||0;
  av.innerHTML = (sal>0 && n>1)
    ? 'Serían <b>'+n+' cuotas de '+money(Math.round(sal/n))+'</b>.'
    : 'Divide lo que debes entre el número de cuotas.';
}
function tipoCompActual(){
  var b=document.querySelector('#tipoSeg button.on');
  return b ? b.getAttribute('data-t') : 'mensual';
}

    (f?'<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarFijo(\''+id+'\')">Eliminar</button>':'');
  sheet(f?'Editar pago fijo':'Nuevo pago fijo', h);

function pickCat(b){
  var bs=b.parentNode.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
  b.classList.add('on');
}
function guardarFijo(id){
  var nom=(document.getElementById('fNom').value||'').trim();
  var mon=unfmt(document.getElementById('fMon').value);
  var tp=tipoCompActual(), dia=0, fch='';
  if(tp==='unica') fch=(document.getElementById('fFecha')||{}).value||'';
  else dia=Math.max(0, Math.min(31, parseInt(String((document.getElementById('fDia')||{}).value||'').replace(/[^\d]/g,''),10)||0));
  var sel=document.querySelector('#fCat button.on');
  var cat=sel?sel.getAttribute('data-c'):'otros_out';
  if(!nom){ toast('Ponle un nombre'); return; }
  if(mon<=0){ toast('¿Cuánto pagas?'); return; }
  if(tp==='unica' ? !fch : !dia){ toast(tp==='unica'?'¿Qué día se paga?':'¿Qué día vence?'); return; }
  var campos={nombre:nom, monto:mon, dia:dia, cat:cat, tipo:tp, fecha:fch};
  if(id){ S.fijos.forEach(function(f){ if(f.id===id){ for(var k in campos) f[k]=campos[k]; } }); }
  else { campos.id=uid(); S.fijos.push(campos); }
  cerrarSheet(); pintarTodo(); toast('Listo ✓');
}
function borrarFijo(id){
  if(!confirm('¿Eliminar este pago fijo? Los pagos que ya registraste se quedan en tus movimientos.')) return;
  S.fijos=S.fijos.filter(function(f){ return f.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Eliminado');
}

    '<label class="f">¿Cuánto debes hoy?</label>'+

    '<label class="f">Tasa de interés (% E.A.)</label>'+

function guardarDeuda(id){
  var nom=(document.getElementById('dNom').value||'').trim();
  var sal=unfmt(document.getElementById('dSal').value);
  var tasa=+String(document.getElementById('dTasa').value||'').replace(',','.')||0;
  if(!nom){ toast('Ponle un nombre'); return; }
  if(sal<=0){ toast('¿Cuánto debes?'); return; }
  var tp=tipoCompActual(), cuo=0, dia=0, fch='', n=0;
  if(tp==='unica'){
    fch=(document.getElementById('dFecha')||{}).value||'';
    if(!fch){ toast('¿Qué día la tienes que pagar?'); return; }
  }else if(tp==='cuotas'){
    n=parseInt(String((document.getElementById('dN')||{}).value||'').replace(/[^\d]/g,''),10)||0;
    fch=(document.getElementById('dPrimera')||{}).value||'';
    if(n<2){ toast('¿En cuántas cuotas? Pon 2 o más'); return; }
    if(!fch){ toast('¿Cuándo pagas la primera cuota?'); return; }
    cuo=Math.round(sal/n);
    dia=+fch.slice(8,10);
  }else{
    cuo=unfmt((document.getElementById('dCuota')||{}).value||0);
    dia=Math.max(0, Math.min(31, parseInt(String((document.getElementById('dDia')||{}).value||'').replace(/[^\d]/g,''),10)||0));
  }
  var campos={nombre:nom, saldo:sal, tasa:tasa, cuota:cuo, dia:dia, tipo:tp, fecha:fch, n:n};
  if(id){ S.deudas.forEach(function(x){ if(x.id===id){ for(var k in campos) x[k]=campos[k]; } }); }
  else { campos.id=uid(); S.deudas.push(campos); }
  cerrarSheet(); pintarTodo(); toast('Listo ✓');
}
function borrarDeuda(id){
  S.deudas=S.deudas.filter(function(x){ return x.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Deuda eliminada 🎉');
}

/* ---- perfil ---- */
function editarPerfil(){
  sheet('Mis datos',
    '<label class="f">¿Cuánto esperas ganar al mes? (opcional)</label>'+
    '<input class="f tnum" id="pIng" inputmode="numeric" placeholder="$0" value="'+(S.perfil.ingresoEsperado?fmtNum(S.perfil.ingresoEsperado):'')+'" oninput="fmtIn(this)">'+
    '<div class="s12 faint mt8">Sirve para calcular tu plan mientras acumulas historial. Después el app usa lo que de verdad entra.</div>'+
    '<button class="btn mt20" onclick="guardarPerfil()">Guardar</button>');
}
function guardarPerfil(){
  var elIng=document.getElementById('pIng');
  var elSal=document.getElementById('pSal'), elAho=document.getElementById('pAho');
  S.perfil.nombre='Salomé';
  if(elIng) S.perfil.ingresoEsperado=unfmt(elIng.value);
  if(elSal || elAho){
    var dis=elSal?unfmt(elSal.value):0, aho=elAho?unfmt(elAho.value):0;
    if(dis>0 || aho>0){
      S.perfil.saldoInicial=dis; S.perfil.ahorroInicial=aho;
      S.perfil.saldoDesde=new Date().toISOString();
    }
  }
  S.perfil.onboarded=true;
  cerrarSheet(); pintarTodo(); toast('Guardado ✓');
}

}

   '<ul><li>Que estén <b>vigilados por la Superintendencia Financiera</b>.</li>'+

   '<p>Si cumplen las dos, tu plata tiene la misma protección legal que en un banco tradicional. En 2026 varias de estas entidades pagan tasas mucho mejores en la cuenta de ahorros que la banca de siempre.</p>'+
   '<p>Lo que sí cambia: la atención es por chat o app, no por ventanilla. Si necesitas hablar con alguien en persona, tenlo en cuenta.</p>'+
   '<div class="alerta">Cuidado con confundir un banco digital vigilado con una «app de inversión» que promete rentabilidades altas y no está vigilada por nadie. No es lo mismo.</div>'},

{id:'bancolombia', c:'cuentas', t:'Tu cuenta Bancolombia: qué revisar',
 k:'bancolombia bolsillos cuota manejo plan cero bronce plata oro app mi bancolombia sucursal virtual '+
   'cdt bancolombia rendimiento cuenta ahorros mi banco',
 r:'Usa los Bolsillos para separar plata, revisa qué plan de cuota de manejo tienes y compara antes de abrir un CDT.',
 b:'<p>Cuatro cosas concretas que puedes hacer hoy desde la app.</p>'+

   '<p><b>1. Bolsillos: tu mejor herramienta y es gratis.</b> Dejan separar plata dentro de tu misma cuenta de ahorros. '+
   'Lo importante es que <b>lo que metes a un Bolsillo deja de sumar a tu saldo disponible</b>, así que no te lo gastas sin darte cuenta. '+
   'Puedes crear uno para el colchón de emergencia, otro para los pagos del mes y otro por cada meta. '+
   'También se puede programar un traslado automático el día que te pagan — eso es «págate a ti primera» en piloto automático.</p>'+

   '<p><b>2. Revisa qué plan de cuota de manejo tienes.</b> Bancolombia maneja planes con costos distintos: '+
   'Cero (<span class="num">$0</span>), Bronce (<span class="num">$5.990</span>), Plata (<span class="num">$8.990</span>) y '+
   'Oro (<span class="num">$14.190</span>) al mes. Si usas poco efectivo y te mueves por la app, el plan más barato puede alcanzarte de sobra. '+
   'El plan se cambia desde la misma app.</p>'+
   '<div class="tip">Pasar de Oro a Cero son unos <span class="num">$170.000</span> al año que te quedas tú.</div>'+

   '<p><b>3. La cuenta de ahorros casi no paga intereses.</b> Está alrededor de <span class="num">0,05%</span> a '+
   '<span class="num">0,5% E.A.</span>, frente a una inflación cercana al <span class="num">6%</span>. '+
   'Para el día a día eso está bien — la cuenta es para mover plata, no para hacerla crecer. '+
   'Pero si vas a dejar quieto el colchón varios meses ahí, vale la pena saber que está perdiendo poder de compra.</p>'+

   '<p><b>4. Si vas a abrir un CDT, cotiza primero.</b> En septiembre de 2026 las tasas de CDT de Bancolombia han estado '+
   'entre las más bajas del mercado (del orden de <span class="num">8,1%</span> a <span class="num">9%</span> E.A. según el plazo), '+
   'mientras otras entidades vigiladas llegaban a <span class="num">11%</span> o más. '+
   'No significa que Bancolombia esté mal: significa que en este producto conviene comparar antes de amarrar la plata.</p>'+

   '<div class="tip"><b>Además:</b> confirma en la app o en una sucursal que tu cuenta esté marcada como '+
   '<b>exenta del 4x1000</b>. Y tranquila con la seguridad: Bancolombia está vigilada por la Superfinanciera '+
   'y cubierta por Fogafín hasta <span class="num">$50 millones</span>.</div>'+

   '<div class="alerta">Las tarifas y tasas cambian. Estas son de referencia a septiembre de 2026: '+
   'confírmalas en la app antes de decidir algo.</div>',
 ir:'plan', irt:'Ver mi colchón'},

{id:'nequi', c:'cuentas', t:'Nequi y Daviplata: ¿sirven para ahorrar?',
 k:'nequi daviplata billetera bolsillo ahorro app celular',
 r:'Sirven para el día a día. Para ahorrar de verdad, casi no pagan intereses.',
 b:'<p>Son excelentes para lo que fueron hechas: mover plata rápido, pagar, recibir, dividir cuentas.</p>'+
   '<p>Para ahorrar tienen dos problemas. El primero es que rinden muy poco o nada, así que la inflación se te come el saldo. El segundo es más humano: la plata está en la misma app con la que pagas todo, así que tarde o temprano se gasta.</p>'+
   '<p>Sirve usar sus «bolsillos» o «metas» para separar visualmente montos pequeños. Pero el colchón y el ahorro de verdad conviene tenerlos en otra entidad que pague intereses y que no abras diez veces al día.</p>'},

/* ---------------- deudas ---------------- */
{id:'tarjeta', c:'deudas', t:'Cómo funciona de verdad una tarjeta de crédito',
 k:'tarjeta credito como funciona cupo diferir cuotas intereses',
 r:'No es plata tuya: es un préstamo caro. Si pagas todo antes del corte, no cobra intereses.',
 b:'<p>La tarjeta no es una extensión de tu sueldo. Es un préstamo con una de las tasas más altas del mercado.</p>'+
   '<p>La clave está en <b>diferir o no</b>. Si pagas el total facturado antes de la fecha límite, en general no pagas intereses: usaste plata prestada gratis. Si difieres a cuotas, empiezan a correr intereses sobre el saldo.</p>'+
   '<p>Ahí está la trampa: difieres una compra a 12 cuotas, y el mes siguiente vuelves a usar la tarjeta. Se van acumulando cuotas encima de cuotas hasta que la factura mensual ya no la reconoces.</p>'+
   '<div class="tip"><b>Regla simple:</b> si no puedes pagarlo completo el mes que viene, no lo compres con tarjeta.</div>'},

{id:'pago-minimo', c:'deudas', t:'Por qué el pago mínimo es una trampa',
 k:'pago minimo tarjeta trampa nunca termino deuda eterna',
 r:'Cubre casi solo intereses. Pagando el mínimo la deuda puede durar años.',
 b:'<p>El pago mínimo está calculado para que el banco no te reporte en mora, no para que salgas de la deuda.</p>'+
   '<p>Buena parte de ese pago se va en intereses y muy poco toca lo que realmente debes. Por eso pagas juiciosa cada mes y el saldo casi no baja: la sensación de estar corriendo sin avanzar es literal.</p>'+
   '<p>Con una deuda de tarjeta a tasas colombianas, pagar solo el mínimo puede estirar la deuda por años y hacerte pagar mucho más de lo que compraste.</p>'+
   '<div class="alerta"><b>Qué hacer:</b> paga siempre <b>más</b> que el mínimo, aunque sea un poco. Todo lo que va por encima del mínimo ataca la deuda directamente.</div>'},

{id:'usura', c:'deudas', t:'¿Qué es la tasa de usura?',
 k:'usura tasa maxima legal superfinanciera limite interes',
 r:'El máximo legal que te pueden cobrar. Por encima de eso es delito.',
 b:'<p>Es el techo legal de intereses en Colombia. La Superintendencia Financiera la certifica periódicamente, y cobrar por encima es un delito.</p>'+
   '<p>Con la tasa del Banco de la República en <span class="num">12%</span> durante 2026, las tarjetas de crédito y los créditos de consumo se han movido en rangos altos, del orden del <span class="num">25%</span> al <span class="num">30% E.A.</span> Consulta la cifra vigente en la página de la Superfinanciera antes de firmar algo.</p>'+
   '<p>Para qué te sirve saberlo: es tu punto de referencia. <b>Ninguna inversión legal y segura te va a pagar lo que te cuesta una deuda a esas tasas.</b> Por eso pagar esa deuda rinde más que cualquier inversión.</p>'},

{id:'gota', c:'deudas', t:'Gota a gota: por qué nunca',
 k:'gota a gota prestamo diario informal paga diario usurero cobradiario',
 r:'Tasas muy por encima de lo legal, cobro violento y una deuda que no termina.',
 b:'<p>El gota a gota se ve fácil: sin papeles, sin consulta en centrales de riesgo, plata el mismo día. Ese es exactamente el problema.</p>'+
   '<p>Las tasas están muy por encima del límite legal. Una deuda pequeña se multiplica en semanas, y el cobro suele venir con amenazas y presión sobre la familia.</p>'+
   '<p>Casi cualquier alternativa es mejor: un adelanto de nómina, un fondo de empleados, una cooperativa, un crédito de bajo monto en una entidad vigilada, o pedirle a alguien de confianza dejando por escrito cómo se paga.</p>'+
   '<div class="alerta">Si ya estás en una de estas, no es cuestión de estrategia financiera: busca ayuda. Puedes denunciar de forma anónima ante la Policía o la Fiscalía.</div>'},

{id:'avalancha', c:'deudas', t:'Si tengo varias deudas, ¿cuál pago primero?',
 k:'avalancha bola de nieve orden pagar deudas cual primero estrategia',
 r:'Por matemática, la de tasa más alta. Por motivación, la más pequeña.',
 b:'<p>Hay dos métodos y los dos funcionan:</p>'+
   '<p><b>Avalancha.</b> Pagas primero la de <b>mayor tasa de interés</b>, mientras haces el mínimo en las demás. Es la que menos intereses te hace pagar en total. Es la matemáticamente correcta.</p>'+
   '<p><b>Bola de nieve.</b> Pagas primero la <b>más pequeña</b>, sin importar la tasa. Cuesta un poco más en intereses, pero tachar una deuda completa da un empujón real de ánimo.</p>'+
   '<p>Si tienes muchas deudas pequeñas y te sientes ahogada, empieza por bola de nieve para ganar impulso. Si aguantas la espera, la avalancha te ahorra más plata.</p>'+
   '<div class="tip">Mi Plata ordena tus deudas de mayor a menor tasa y te muestra cuánto te cuesta cada una al mes solo en intereses.</div>',
 ir:'plan', irt:'Ver mis deudas ordenadas'},

{id:'datacredito', c:'deudas', t:'Datacrédito: qué es y cómo salgo de ahí',
 k:'datacredito centrales riesgo reporte mora historial credito puntaje transunion',
 r:'Tu historial de pagos. Pagar es el único camino real, y el reporte negativo se va con el tiempo.',
 b:'<p>Las centrales de riesgo guardan tu historial de crédito: qué debes, si pagas a tiempo, si te has atrasado. Los bancos lo consultan antes de prestarte.</p>'+
   '<p>Un reporte negativo no es eterno. La ley de habeas data fija plazos: una vez pagas la obligación, el dato negativo permanece un tiempo limitado y luego debe salir. El tiempo depende de cuánto duraste en mora.</p>'+
   '<p>Puedes consultar tu reporte <b>gratis</b> — tienes derecho a hacerlo. Desconfía de quien te cobre por «borrarte» de Datacrédito: nadie puede borrar un dato cierto, y quien lo promete está estafándote.</p>'+
   '<div class="tip">Si el dato reportado está equivocado, puedes reclamar directamente a la central y a la entidad. Están obligadas a responder.</div>'},

{id:'cuotas-sin-interes', c:'deudas', t:'«12 cuotas sin interés»: ¿es cierto?',
 k:'cuotas sin interes diferido tarjeta compra promocion trampa',
 r:'A veces sí. Pero comprometes cupo por un año y suele haber precio de contado más barato.',
 b:'<p>Cuando de verdad es sin interés, no te cobran de más. El problema es otro.</p>'+
   '<p><b>Compromete tu cupo por 12 meses.</b> Esa cuota va a estar ahí cada mes, pase lo que pase con tu trabajo o tu salud.</p>'+
   '<p><b>Se acumulan.</b> Tres compras «sin interés» de tres meses distintos y ya tienes tres cuotas fijas comiéndote la quincena.</p>'+
   '<p><b>Muchas veces hay precio de contado más barato.</b> Pregunta siempre cuánto cuesta pagando de una: la diferencia es el interés escondido.</p>'+
   '<div class="tip">Prueba honesta: si no tienes la plata hoy para pagarlo completo, no es una compra sin interés — es una deuda.</div>'},

{id:'cuanta-deuda', c:'deudas', t:'¿Cuánta deuda es demasiada?',
 k:'cuanta deuda limite endeudamiento maximo sobreendeudada capacidad',
 r:'Si tus cuotas pasan del 30% de lo que ganas, estás en zona de riesgo.',
 b:'<p>Suma todas las cuotas mensuales de tus deudas y divídelo entre lo que ganas al mes.</p>'+
   '<ul><li><b>Menos de 20%:</b> manejable.</li>'+
   '<li><b>Entre 20% y 30%:</b> apretado, no tomes más deuda.</li>'+
   '<li><b>Más de 30%:</b> zona de riesgo. Cualquier imprevisto te tumba.</li></ul>'+
   '<p>Hay señales que valen más que el porcentaje: si estás pagando una tarjeta con otra tarjeta, si pagas solo mínimos, o si necesitas prestar para llegar a fin de mes, ya pasaste el límite sin importar la cuenta.</p>'+
   '<p>En ese punto lo que ayuda no es apretarse más, es hablar con la entidad. Muchas negocian reestructurar la deuda antes de que caigas en mora — después es más difícil.</p>'},

/* ---------------- ahorro e inversión ---------------- */
{id:'cdt', c:'invertir', t:'¿Qué es un CDT?',
 k:'cdt certificado deposito termino plazo fijo invertir tasa',
 r:'Prestas plata al banco por un plazo fijo a cambio de una tasa conocida desde el día uno.',
 b:'<p>Un CDT es un trato simple: dejas una plata quieta durante un plazo (90, 180, 360 días) y el banco te paga una tasa acordada. Sabes exactamente cuánto vas a recibir y cuándo.</p>'+
   '<p><b>La ventaja:</b> no hay sorpresas y está cubierto por Fogafín hasta <span class="num">$50 millones</span> por entidad. Es de lo más seguro que hay.</p>'+
   '<p><b>El costo:</b> no puedes sacar la plata antes. Por eso <b>nunca metas ahí tu colchón de emergencia</b>.</p>'+
   '<p>En septiembre de 2026 los CDT a 360 días se han movido entre <span class="num">9%</span> y <span class="num">13,5% E.A.</span> según la entidad. La diferencia entre bancos es grande: vale la pena cotizar en tres o cuatro antes de decidir.</p>'+
   '<div class="tip">Sirve para metas con fecha: un viaje en 8 meses, el semestre, una cuota inicial.</div>'},

{id:'fic', c:'invertir', t:'¿Qué es un FIC (fondo de inversión colectiva)?',
 k:'fic fondo inversion colectiva fiduciaria portafolio administrado',
 r:'Un fondo donde muchas personas juntan plata y un gestor profesional la invierte.',
 b:'<p>En un FIC tu plata se junta con la de otras personas y una sociedad vigilada la invierte en un portafolio: bonos, acciones, deuda, según el tipo de fondo.</p>'+
   '<p><b>A favor:</b> puedes entrar con montos bajos, hay diversificación desde el primer peso y algunos permiten retirar rápido.</p>'+
   '<p><b>En contra:</b> la rentabilidad <b>no está garantizada</b> — puede ser negativa. Y cobran comisión de administración, que se descuenta rinda o no rinda.</p>'+
   '<p>Antes de entrar, pregunta tres cosas: en qué invierte exactamente, cuánto cobra de comisión al año, y en cuántos días te devuelven la plata si la pides.</p>'+
   '<div class="alerta">Rentabilidades pasadas no garantizan rentabilidades futuras. Que haya dado 12% el año pasado no significa nada sobre el próximo.</div>'},

{id:'real-nominal', c:'invertir', t:'Rentabilidad nominal vs real',
 k:'rentabilidad real nominal inflacion descontar ganancia verdadera',
 r:'Nominal es lo que dice el papel. Real es lo que queda después de la inflación.',
 b:'<p>Si tu plata rinde 8% en un año y la inflación fue 6%, tu ganancia <b>real</b> fue cerca de 2%. Eso es lo que de verdad ganaste en capacidad de compra.</p>'+
   '<p>Es la única cifra que importa a la hora de comparar. Un 8% con inflación de 6% es peor negocio que un 5% con inflación de 2%.</p>'+
   '<p>Por eso, con la inflación colombiana rondando el 6% en 2026, cualquier producto que pague menos de eso te está haciendo perder — así el saldo suba.</p>',
 ir:'inv', irt:'Calcular mi rentabilidad real'},

{id:'riesgo', c:'invertir', t:'¿Qué significa «riesgo» en una inversión?',
 k:'riesgo perdida volatilidad seguro garantizado diversificar',
 r:'La posibilidad real de recibir menos de lo que pusiste. Más rentabilidad prometida, más riesgo.',
 b:'<p>Riesgo no es una palabra decorativa: es la probabilidad de que la inversión valga menos de lo que pusiste, incluso durante años.</p>'+
   '<p>La relación es inseparable: <b>más rentabilidad posible siempre viene con más riesgo</b>. No existe lo contrario. Si alguien te ofrece alta rentabilidad sin riesgo, o no entiende lo que vende o te está mintiendo.</p>'+
   '<p>Cómo se maneja:</p>'+
   '<ul><li><b>Plazo.</b> Solo asume riesgo con plata que no vas a necesitar en varios años.</li>'+
   '<li><b>Diversificar.</b> No pongas todo en un solo lugar.</li>'+
   '<li><b>Entender.</b> Si no puedes explicar en qué invertiste, no inviertas ahí.</li></ul>'},

{id:'estafas', c:'invertir', t:'Cómo reconocer una estafa de inversión',
 k:'estafa piramide fraude ponzi rentabilidad fija garantizada esquema captacion ilegal mensual prometen ofrecen ofreciendo me ofrecieron multiplicar duplicar plata facil ganancia asegurada inversion milagrosa',
 r:'Rentabilidad fija y alta, presión para decidir ya, y ganar por meter gente.',
 b:'<p>Las señales se repiten casi siempre igual:</p>'+
   '<ul><li><b>«Rentabilidad fija del 15% mensual».</b> No existe. Si existiera, los bancos lo harían y nadie trabajaría.</li>'+
   '<li><b>Ganas por referir gente.</b> Eso es una pirámide: la plata de los nuevos paga a los viejos, hasta que se acaba.</li>'+
   '<li><b>Presión para decidir hoy.</b> «Solo quedan 3 cupos». Una oportunidad real aguanta que la pienses una semana.</li>'+
   '<li><b>No está vigilada por la Superfinanciera.</b> Captar plata del público sin autorización es delito en Colombia.</li>'+
   '<li><b>Testimonios y lujos en redes.</b> Los carros y los fajos de billetes no son estados financieros.</li></ul>'+
   '<div class="alerta"><b>Antes de entregar un peso:</b> verifica en la página de la Superintendencia Financiera si la entidad está autorizada. Es gratis y toma dos minutos.</div>'},

{id:'superfinanciera', c:'invertir', t:'Cómo verificar si una entidad es legal',
 k:'superfinanciera verificar vigilada legal autorizada consultar entidad',
 r:'La Superintendencia Financiera tiene un buscador público y gratuito de entidades vigiladas.',
 b:'<p>En Colombia, quien capta plata del público tiene que estar autorizado y vigilado por la <b>Superintendencia Financiera</b>. No es opcional.</p>'+
   '<p>En su página hay un buscador público donde escribes el nombre de la entidad y te dice si está vigilada. También publican listas de entidades no autorizadas que están captando de forma ilegal.</p>'+
   '<p>Hazlo siempre, incluso si te lo recomendó alguien de confianza. Las pirámides se propagan justamente por recomendación de gente de confianza que todavía no ha perdido su plata.</p>'},

{id:'acciones-dolar', c:'invertir', t:'¿Y las acciones, las criptos y el dólar?',
 k:'acciones bolsa bvc dolar cripto bitcoin etf trading especular',
 r:'Solo con plata que puedas dejar quieta años y que puedas perder sin que te afecte.',
 b:'<p>Estas opciones pueden rendir más en plazos largos, pero suben y bajan fuerte. No son un lugar para el colchón ni para la plata del arriendo.</p>'+
   '<p>La regla de entrada es dura pero honesta: <b>solo con plata que no vas a necesitar en 3 a 5 años y cuya pérdida no te cambia la vida.</b></p>'+
   '<p>Y el orden importa. Si todavía tienes deuda de tarjeta al 28%, comprar acciones es matemáticamente absurdo: estarías apostando a ganar más del 28% garantizado, que es justo lo que te ahorrarías pagando la deuda.</p>'+
   '<div class="alerta">Desconfía del «trading» que se enseña en cursos pagos por redes. El negocio de quien lo vende es el curso, no el trading.</div>'},

/* ---------------- trabajo y leyes ---------------- */
{id:'smmlv', c:'trabajo', t:'Salario mínimo y auxilio de transporte 2026',
 k:'salario minimo smmlv auxilio transporte 2026 cuanto es',
 r:'$1.750.905 de salario y $249.095 de auxilio de transporte.',
 b:'<p>Para 2026 en Colombia:</p>'+
   '<ul><li><b>Salario mínimo:</b> <span class="num">$1.750.905</span> al mes.</li>'+
   '<li><b>Auxilio de transporte:</b> <span class="num">$249.095</span> al mes.</li></ul>'+
   '<p>El auxilio lo reciben quienes ganan hasta 2 salarios mínimos. Sumados, dan <span class="num">$2.000.000</span> exactos.</p>'+
   '<p>Ojo con una confusión común: el auxilio de transporte <b>no</b> es salario para todos los efectos, pero <b>sí</b> se incluye para calcular prestaciones como la prima y las cesantías.</p>'},

{id:'prima', c:'trabajo', t:'La prima de servicios: qué es y cuándo llega',
 k:'prima servicios junio diciembre cuanto me toca calcular pago',
 r:'Un salario extra al año, repartido en dos pagos: junio y diciembre.',
 b:'<p>La prima equivale a <b>un mes de salario por año trabajado</b>, y se paga en dos partes: máximo el 30 de junio y máximo el 20 de diciembre.</p>'+
   '<p>Si no trabajaste el año completo, te pagan la parte proporcional. Para el cálculo se toma el salario más el auxilio de transporte, si lo recibes.</p>'+
   '<p><b>La decisión importante es qué haces con ella.</b> Es plata que no es parte de tu presupuesto normal, así que es la oportunidad más fácil del año para llenar el colchón de un golpe o matar una deuda cara.</p>'+
   '<div class="tip">Regístrala en Mi Plata con la categoría <b>Prima</b>, no como salario. Así el plan no cree que ganas eso todos los meses.</div>'},

{id:'cesantias', c:'trabajo', t:'Cesantías e intereses de cesantías',
 k:'cesantias intereses fondo retirar vivienda educacion febrero',
 r:'Un mes de salario al año guardado en un fondo, más un 12% de intereses que te pagan en enero.',
 b:'<p>Las cesantías son un <b>mes de salario por año trabajado</b>, pensadas como respaldo si te quedas sin empleo. El empleador las consigna en un fondo antes del 14 de febrero de cada año.</p>'+
   '<p>Además te deben pagar los <b>intereses de cesantías</b>: el 12% anual sobre ese saldo, que se te paga directamente a ti a más tardar el 31 de enero.</p>'+
   '<p>Puedes retirarlas antes de quedar desempleada solo para casos específicos: vivienda (comprar, mejorar o pagar crédito) y educación.</p>'+
   '<div class="alerta">Sacarlas para gastos corrientes es tentador y suele salir caro: es justo la plata que te sostiene si te quedas sin trabajo.</div>'},

{id:'seguridad-social', c:'trabajo', t:'Salud, pensión y ARL: qué te descuentan',
 k:'eps salud pension arl seguridad social descuentos nomina aportes',
 r:'Como empleada te descuentan 4% de salud y 4% de pensión. La ARL la paga el empleador.',
 b:'<p>Si eres empleada con contrato laboral, de tu salario te descuentan:</p>'+
   '<ul><li><b>Salud:</b> 4% (el empleador aporta 8,5% adicional).</li>'+
   '<li><b>Pensión:</b> 4% (el empleador aporta 12% adicional).</li></ul>'+
   '<p>La <b>ARL</b> (riesgos laborales) la paga completa el empleador, no te la pueden descontar.</p>'+
   '<p>Si ganas más de 4 salarios mínimos, se suma un aporte al Fondo de Solidaridad Pensional.</p>'+
   '<p>Por eso tu salario «neto» es menor que el que negociaste. Cuando armes tu presupuesto, usa <b>lo que te llega a la cuenta</b>, no el salario bruto del contrato.</p>'},

{id:'independiente', c:'trabajo', t:'Si trabajo por mi cuenta, ¿cómo me organizo?',

/* ---------- buscador: sin tildes, sin mayúsculas ---------- */
function norm(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  return s.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
ARTS.forEach(function(a){ a._t=norm(a.t); a._k=norm(a.k); a._r=norm(a.r); a._b=norm(a.b); });

/* palabras de relleno: no aportan nada al buscar */
var STOP={};
('que como cual cuales para por con sin del los las una unos unas este esta esto eso '+
 'mas muy pero porque cuando donde quien mi tu su se lo la el un de en al es son si no '+
 'hay ser estar tener hacer debo debe deberia puedo quiero necesito sirve vale pena '+
 'conviene mejor cosa cosas hago tengo saber sobre me te nos').split(' ')
  .forEach(function(w){ STOP[w]=1; });

function buscar(q){
  var term=norm(q);
  if(!term) return null;
  var palabras=term.split(' ').filter(function(w){ return w.length>1; });
  if(!palabras.length) return [];
  var clave=palabras.filter(function(w){ return !STOP[w]; });
  if(!clave.length) clave=palabras;

  /* palabra corta: coincidencia exacta (asi «20» no cae dentro de «2026»).
     palabra larga: basta con que empiece igual («mensual» encuentra «mensuales»). */
  function hay(txt,w){
    if(w.length<=3) return (' '+txt+' ').indexOf(' '+w+' ')>=0;
    return (' '+txt).indexOf(' '+w)>=0;
  }
  function puntuar(w,a){
    var s=0;
    if(hay(a._t,w)) s+=10;
    if(hay(a._k,w)) s+=6;
    if(hay(a._r,w)) s+=3;
    if(hay(a._b,w)) s+=1;
    return s;
  }
  function correr(exigirTodas){
    var res=[];
    ARTS.forEach(function(a){
      var p=0, n=0;
      clave.forEach(function(w){ var s=puntuar(w,a); if(s){ n++; p+=s; } });
      if(!n) return;
      if(exigirTodas && n<clave.length) return;
      res.push({a:a, p:p, n:n});
    });
    res.sort(function(x,y){ return (y.n-x.n) || (y.p-x.p); });
    return res.map(function(r){ return r.a; });
  }
  /* primero exige todas las palabras; si no hay nada, acepta parciales */
  var r=correr(true);
  return r.length ? r : correr(false);
}

function petEstado(){
  if(PET.forz) return PET.forz;
  if(!STORAGE_OK) return 'cry';
  var pv=prevision();
  if(pv.vencidos.length) return 'sad';
  if(plan().rescate) return 'cry';
  if(!S.mov.length) return 'idle';
  var hoy=hoyISO();

function petPintar(){
  var el=document.getElementById('petSprite'); if(!el) return;
  var izq=el.classList.contains('izq');

}
function petForzar(e, ms){
  PET.forz=e; clearTimeout(PET.ft);
  PET.ft=setTimeout(function(){ PET.forz=null; petPintar(); }, ms||2600);
  petPintar();
}
function petDecir(txt){
  var m=document.getElementById('petMsg'); if(!m) return;
  m.innerHTML=txt; m.classList.add('on');
  clearTimeout(petDecir._t);
  petDecir._t=setTimeout(function(){ m.classList.remove('on'); }, 6500);
}
function petAgendar(){
  clearTimeout(PET.t);
  PET.t=setTimeout(petAccion, 7000+Math.random()*9000);
}
function petAccion(){
  petAgendar();
  if(document.hidden || petMenosMovimiento()) return;
  var base=petEstado();
  if(base!=='idle' && base!=='sleep') return;
  var caja=document.getElementById('pet'), sp=document.getElementById('petSprite');
  if(!caja || !sp) return;
  /* a veces suelta algo sin que lo toquen; los recados de Rafael, muy de vez en cuando */
  if(Math.random()<0.12){
    petDecir(Math.random()<0.04 ? unaDe(PXRAFA) : unaDe(PXMIMOS));
    petForzar(Math.random()<0.5?'happy':'dance', 2800);
    return;
  }
  if(Math.random()<0.5){
    /* pasea, sin meterse debajo del botón + que está en el centro */
    var fab=document.querySelector('.fab');
    var tope=fab ? fab.getBoundingClientRect().left-10 : window.innerWidth*0.45;
    var max=Math.max(8, PET.x + (tope - sp.getBoundingClientRect().right));
    var destino=Math.round(8+Math.random()*Math.max(0, max-8));
    sp.classList.toggle('izq', destino<PET.x);
    PET.x=destino;
    caja.style.transition='transform 1.5s linear';
    caja.style.transform='translateX('+PET.x+'px)';
    petForzar('run', 1500);
  }else{
    petForzar(PXGRACIAS[Math.floor(Math.random()*PXGRACIAS.length)], 2800);
  }
}
function petTocar(){
  var ahora=Date.now();
  PET.toques=(ahora-PET.tt<1200)?PET.toques+1:1; PET.tt=ahora;
  if(PET.toques>=5){
    PET.toques=0;
    petDecir('Me escondí. Tú sigue con lo tuyo. 📦');
    petForzar('box', 4200); return;
  }
  var d=Math.random();
  if(d<0.025){ petDecir(unaDe(PXRAFA)); petForzar('happy', 3000); return; }
  if(d<0.45){ petDecir(unaDe(PXMIMOS)); petForzar('excited', 2400); return; }
  var fr=frasesGato();
  PET.idx=PET.idx%fr.length;
  petDecir(fr[PET.idx]); PET.idx++;
  petForzar('sad', 1300);
}

  'Rafael dice que te quiere. Así, sin adorno.',
  'Me enseñaron a decir una sola cosa en tu idioma: te extraño, Salomé. 🖤'
];
function unaDe(a){ return a[Math.floor(Math.random()*a.length)]; }

function frasesGato(){
  var pv=prevision(), p=plan(), sa=saldoActual(), r=resumen(ymHoy()), f=[];
  if(!STORAGE_OK) f.push('Miau. Este navegador no está guardando nada: haz una copia en <b>Más</b>.');
  if(pv.vencidos.length) f.push('Se te venció <b>'+esc(pv.vencidos[0].nombre)+'</b>. ¿Ya lo pagaste?');
  if(p.rescate) f.push('Estás gastando <b>'+money(p.rescate.hueco)+'</b> más de lo que ganas. Miremos el plan.');
  if(pv.falta>0) f.push('Te faltan <b>'+money(pv.falta)+'</b> para los pagos de este mes.');
  var libre=(sa===null?r.saldo:sa)-pv.porPagar;
  if(libre>0) f.push('Te quedan <b>'+money(libre)+'</b> libres. Vamos bien. 🐾');
  if(p.sugerido>0) f.push('Si guardas <b>'+money(p.sugerido)+'</b> este mes, vas justo donde tienes que ir.');
  var hoy=hoyISO();
  if(!S.mov.some(function(m){ return (m.creado||'').slice(0,10)===hoy; }))
    f.push('Hoy no has anotado nada. Toca el <b>+</b>, son cinco segundos.');
  if(p.col>0) f.push('Llevas <b>'+money(p.col)+'</b> de colchón. Eso ya es tranquilidad.');
  f.push('Estoy aquí para que no adivines. Los números los pongo yo.');
  f.push('Ronroneo gratis incluido. 🐾');
  return f;
}

/* ---- tema ---- */
function aplicarTema(){
  var t=S.ajustes.tema||'auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  var b=document.getElementById('temaBtn');
  if(b) b.textContent = t==='dark'?'☀️':(t==='light'?'🌙':'🌗');
}
function setTema(t){ S.ajustes.tema=t; aplicarTema(); pintarTodo(); }
function toggleTema(){
  var o={auto:'light',light:'dark',dark:'auto'};
  setTema(o[S.ajustes.tema||'auto']);
  toast({auto:'Tema automático',light:'Tema claro',dark:'Tema oscuro'}[S.ajustes.tema]);
}

/* =========================================================================
   ARRANQUE
   ========================================================================= */
(function arrancar(){
  STORAGE_OK=probarAlmacenamiento();
  var ls=lsGet(), sd=semilla();
  S = masNuevo(ls, sd) || estadoNuevo();
  var b=estadoNuevo();
  S.perfil=Object.assign(b.perfil, S.perfil||{});
  S.ajustes=Object.assign(b.ajustes, S.ajustes||{});
  S.mov=S.mov||[]; S.metas=S.metas||[]; S.deudas=S.deudas||[]; S.fijos=S.fijos||[];
  S.perfil.nombre='Salomé';
  aplicarTema(); aplicarGato(); pintar(); petAgendar(); montarArrastre();

  abrirIDB().then(function(db){
    idb=db;
    return idbGet();
  }).then(function(ix){
    var mejor=masNuevo(ix, S);
    if(mejor && mejor!==S && (mejor.updatedAt||'') > (S.updatedAt||'')){
      S=mejor;
      S.perfil=Object.assign(estadoNuevo().perfil, S.perfil||{});
      S.ajustes=Object.assign(estadoNuevo().ajustes, S.ajustes||{});
      aplicarTema(); aplicarGato(); pintar();
    }
    guardar();
    if(!S.perfil.onboarded && !S.mov.length) setTimeout(onboarding, 450);
  });

  /* modo app: solo aplica cuando esta publicado en una direccion https.
     Con el archivo suelto no hace nada y la app funciona igual. */
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  /* Safari de iOS ignora user-scalable=no, asi que la pinza se bloquea aqui.
     Son eventos propios de WebKit: en Android ni se disparan. */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  /* red de seguridad: si algun iOS deja pasar la pinza como touchmove */
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length>1) e.preventDefault();
  }, {passive:false});
  /* si el sistema alcanza a aplicar un zoom, se devuelve solo */
  window.addEventListener('resize', function(){
    if(window.visualViewport && window.visualViewport.scale>1.01){
      document.body.style.zoom=''; window.scrollTo(window.scrollX, window.scrollY);
    }
  });

  window.addEventListener('beforeunload', function(){ try{ lsPut(S); }catch(e){} });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) try{ lsPut(S); }catch(e){} });
})();
</script>
