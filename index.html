<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Mi Plata">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<title>Mi Plata</title>
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface2:#faf9f5; --sunken:#eeece4;
  --text:#1b1a17; --muted:#6f6d64; --faint:#9a978c; --line:#e4e1d7;
  --accent:#0d7a6f; --accent-ink:#065048; --accent-soft:#dcefea;
  --in:#0d7a6f; --in-soft:#dcefea;
  --out:#c25239; --out-soft:#fbe5df;
  --save:#8a6bc4; --save-soft:#ece4f8;
  --warn:#a8711a; --warn-soft:#fbeed6;
  --danger:#b23b30;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --shadow:0 1px 2px rgba(24,22,17,.05), 0 6px 18px -8px rgba(24,22,17,.16);
  --on-accent:#ffffff;
  --cat:#1b1b24; --cat-paw:#2f2f3c; --cat-ear:#e8aab4; --cat-nose:#e2899b;
  --cat-eye:#f4b73f; --cat-line:#cfccc3; --cat-halo:#e9e5d9; --cat-rim:transparent;
  --accent-lift:#13a191; --fab-glow:13,122,111;
  --nav-h:66px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1d2026; --surface2:#22252c; --sunken:#282c34;
    --text:#eceae4; --muted:#a2a49e; --faint:#75776f; --line:#2f333b;
    --accent:#4ec5b2; --accent-ink:#a9e5db; --accent-soft:#17342f;
    --in:#4ec5b2; --in-soft:#17342f;
    --out:#f08a6c; --out-soft:#3a231c;
    --save:#b79df0; --save-soft:#2a2338;
    --warn:#e0aa54; --warn-soft:#372a15;
    --danger:#f0796a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
    --on-accent:#06231f;
    --cat:#0e0e15; --cat-paw:#20202b; --cat-ear:#c98d98; --cat-nose:#c47b8c;
    --cat-eye:#f4b73f; --cat-line:#7e7b74; --cat-halo:#272b34; --cat-rim:rgba(255,255,255,.55);
    --accent-lift:#74dbc9; --fab-glow:78,197,178;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2026; --surface2:#22252c; --sunken:#282c34;
  --text:#eceae4; --muted:#a2a49e; --faint:#75776f; --line:#2f333b;
  --accent:#4ec5b2; --accent-ink:#a9e5db; --accent-soft:#17342f;
  --in:#4ec5b2; --in-soft:#17342f;
  --out:#f08a6c; --out-soft:#3a231c;
  --save:#b79df0; --save-soft:#2a2338;
  --warn:#e0aa54; --warn-soft:#372a15;
  --danger:#f0796a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
  --on-accent:#06231f;
  --cat:#0e0e15; --cat-paw:#20202b; --cat-ear:#c98d98; --cat-nose:#c47b8c;
  --cat-eye:#f4b73f; --cat-line:#7e7b74; --cat-halo:#272b34; --cat-rim:rgba(255,255,255,.55);
  --accent-lift:#74dbc9; --fab-glow:78,197,178;
  color-scheme:dark;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:none; background:none; padding:0}
h1,h2,h3,p{margin:0}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative}
.screen{display:none; padding:0 16px calc(var(--nav-h) + 96px); animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

.top{padding:calc(env(safe-area-inset-top) + 18px) 0 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.top h1{font-size:25px; line-height:1.15; letter-spacing:-.02em; font-weight:680}
/* o saludo leva o nombre, asi que se ajusta al ancho en vez de partirse en dos */
#saludo{font-size:clamp(18px, 5.4vw, 25px); text-wrap:balance}
.top .sub{font-size:12.5px; color:var(--muted); margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;flex:none;box-shadow:var(--shadow)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.card.flat{box-shadow:none; background:var(--surface2)}
.card h3{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:650; margin-bottom:10px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.s12{font-size:12.5px} .s13{font-size:13.5px} .s14{font-size:14px}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mt20{margin-top:20px}
.center{text-align:center}

/* ---------- hero ---------- */
.hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px; box-shadow:var(--shadow); margin-bottom:12px}
.hero .lbl{font-size:12.5px; color:var(--muted); font-weight:560}
.hero .big{font-size:38px; font-weight:700; letter-spacing:-.03em; line-height:1.08; margin:5px 0 2px}
.hero .big.neg{color:var(--out)}
.hero .note{font-size:13px; color:var(--muted)}
.split{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line); border-radius:var(--r-sm); overflow:hidden; margin-top:16px}
.split>div{background:var(--surface); padding:11px 8px; text-align:center}
.split .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:640}
.split .v{font-size:15px; font-weight:670; margin-top:3px; letter-spacing:-.01em}
.v.in{color:var(--in)} .v.out{color:var(--out)} .v.save{color:var(--save)}

.bar{height:9px; border-radius:99px; background:var(--sunken); overflow:hidden; display:flex}
.bar i{display:block; height:100%}
.bar i.a{background:var(--out)} .bar i.b{background:var(--save)} .bar i.c{background:var(--accent)}

/* ---------- daily pace ---------- */
.pace{display:flex; align-items:baseline; gap:8px; margin-top:4px}
.pace b{font-size:26px; font-weight:700; letter-spacing:-.02em}

/* ---------- lists ---------- */
.item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--sunken)}
.ic.in{background:var(--in-soft)} .ic.out{background:var(--out-soft)} .ic.save{background:var(--save-soft)}
.item .nm{font-weight:570; font-size:14.5px}
.item .dt{font-size:12px; color:var(--faint); margin-top:1px}
.item .amt{margin-left:auto; font-weight:650; font-size:15px; white-space:nowrap; letter-spacing:-.01em}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.save{color:var(--save)}

.catrow{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.catrow .e{width:26px; text-align:center; font-size:15px; flex:none}
.catrow .g{flex:1; min-width:0}
.catrow .t{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; gap:8px}
.catrow .t span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.catrow .t b{font-weight:640; white-space:nowrap}
.mini{height:6px; border-radius:99px; background:var(--sunken); overflow:hidden}
.mini i{display:block;height:100%; background:var(--out); border-radius:99px}
.mini i.ess{background:var(--accent)}

/* ---------- buttons ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px;
  border-radius:13px; background:var(--accent); color:var(--on-accent); font-weight:640; font-size:15px; text-align:center}
.btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--text)}
.btn.soft{background:var(--accent-soft); color:var(--accent-ink)}
.btn.sm{padding:10px 14px; font-size:14px; border-radius:11px; width:auto}
.btn:active{transform:scale(.985)}
.btnrow{display:flex; gap:9px}
.btnrow>*{flex:1}

.chip{padding:7px 13px; border-radius:99px; background:var(--surface); border:1px solid var(--line);
  font-size:13px; font-weight:560; white-space:nowrap}
.chip.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; -ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- fab + nav ---------- */
.fab{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  width:60px; height:60px; border-radius:50%; z-index:40;
  background:linear-gradient(152deg, var(--accent-lift) 0%, var(--accent) 62%);
  color:var(--on-accent); display:grid; place-items:center;
  box-shadow:
    0 1px 2px rgba(var(--fab-glow),.30),
    0 6px 14px -3px rgba(var(--fab-glow),.42),
    0 14px 30px -10px rgba(var(--fab-glow),.55),
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 0 0 1px rgba(255,255,255,.10);
  transition:transform .15s cubic-bezier(.3,.8,.3,1), box-shadow .15s ease}
.fab svg{width:23px; height:23px; display:block}
.fab:active{transform:translateX(-50%) scale(.92);
  box-shadow:0 1px 2px rgba(var(--fab-glow),.35), 0 4px 10px -3px rgba(var(--fab-glow),.45),
             inset 0 1px 0 rgba(255,255,255,.18)}
nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); background:var(--surface); border-top:1px solid var(--line);
  display:flex; z-index:30}
nav .in{max-width:520px; margin:0 auto; width:100%; display:grid; grid-template-columns:repeat(5,1fr)}
nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--nav-h); color:var(--faint); font-size:10px; font-weight:580}
nav button .e{font-size:19px; line-height:1; filter:grayscale(1); opacity:.6}
nav button.on{color:var(--accent)} nav button.on .e{filter:none; opacity:1}

/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; background:rgba(15,14,11,.5); z-index:50; opacity:0; pointer-events:none; transition:opacity .22s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--bg);
  border-radius:24px 24px 0 0; max-width:520px; margin:0 auto; transform:translateY(102%);
  transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:94vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line); margin:9px auto 0; flex:none}
.sheet .body{overflow-y:auto; padding:14px 16px 18px; -webkit-overflow-scrolling:touch}
.sheet h2{font-size:18px; font-weight:670; letter-spacing:-.01em}

/* ---------- keypad ---------- */
.seg{display:flex; gap:4px; background:var(--sunken); padding:4px; border-radius:12px; margin-bottom:14px}
.seg button{flex:1; padding:9px 4px; border-radius:9px; font-size:13.5px; font-weight:620; color:var(--muted)}
.seg button.on{background:var(--surface); box-shadow:var(--shadow)}
.seg button.on[data-t="in"]{color:var(--in)}
.seg button.on[data-t="out"]{color:var(--out)}
.seg button.on[data-t="save"]{color:var(--save)}
.amount{text-align:center; padding:6px 0 12px}
.amount .v{font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1.1}
.amount .v.zero{color:var(--faint)}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px}
.pad button{height:52px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
  font-size:21px; font-weight:560; display:grid; place-items:center; box-shadow:var(--shadow)}
.pad button.sec{font-size:15px; font-weight:620; color:var(--muted); background:var(--surface2)}
.pad button:active{background:var(--sunken)}
.catgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:4px}
.catgrid button{padding:9px 3px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; line-height:1.2; color:var(--muted);
  text-align:center; font-weight:560; min-height:60px; justify-content:center}
.catgrid button .e{font-size:19px; line-height:1}
.catgrid button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

label.f{display:block; font-size:12px; color:var(--muted); font-weight:600; margin:12px 0 5px}
input.f, select.f, textarea.f{width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); font-size:15.5px; outline:none}
input.f:focus, select.f:focus, textarea.f:focus{border-color:var(--accent)}
textarea.f{min-height:88px; resize:vertical; font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- misc ---------- */
.banner{display:flex; gap:11px; align-items:flex-start; padding:13px 14px; border-radius:var(--r); margin-bottom:12px; font-size:13.5px; line-height:1.45}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--out-soft); color:var(--out)}
.banner.ok{background:var(--accent-soft); color:var(--accent-ink)}
.banner b{font-weight:680}
.banner .e{font-size:17px; line-height:1.2; flex:none}
.banner button{text-decoration:underline; font-weight:650; color:inherit; font-size:13px; margin-top:5px; display:block}

.step{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:25px;height:25px;border-radius:50%;background:var(--sunken); color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none; margin-top:1px}
.step.done .n{background:var(--accent); color:var(--on-accent)}
.step.now .n{background:var(--warn); color:#fff}
.step .ti{font-weight:620; font-size:14.5px}
.step.done .ti{color:var(--muted)}
.step .de{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.45}
.step .pill{display:inline-block; margin-top:6px; padding:3px 9px; border-radius:99px; background:var(--warn-soft);
  color:var(--warn); font-size:11.5px; font-weight:680}

.goal{padding:13px 0; border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none}
.goal .hd{display:flex; align-items:center; gap:9px; margin-bottom:7px}
.goal .hd .e{font-size:18px}
.goal .hd .nm{font-weight:620; font-size:14.5px; flex:1}
.goal .hd .pc{font-size:12.5px; color:var(--muted); font-weight:640}
.goal .ft{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; gap:8px}

.opt{border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; background:var(--surface)}
.opt .hd{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.opt .hd .e{font-size:20px}
.opt .hd .nm{font-weight:660; font-size:15px}
.opt .tag{margin-left:auto; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em}
.opt .tag.low{background:var(--accent-soft); color:var(--accent-ink)}
.opt .tag.mid{background:var(--warn-soft); color:var(--warn)}
.opt .tag.high{background:var(--out-soft); color:var(--out)}
.opt p{font-size:13px; color:var(--muted); line-height:1.5}
.opt dl{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:9px 0 0; font-size:12.5px}
.opt dt{color:var(--faint); font-weight:600} .opt dd{margin:0; font-weight:560}

.kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; gap:12px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:650; white-space:nowrap}
.kv.big b{font-size:17px; color:var(--accent)}

.toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(var(--nav-h) + 84px);
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  z-index:90; opacity:0; pointer-events:none; transition:.25s; max-width:88%; text-align:center}
.toast.on{opacity:1; transform:translateX(-50%)}

.empty{text-align:center; padding:36px 20px; color:var(--muted)}
.empty .e{font-size:38px; display:block; margin-bottom:10px; opacity:.75}
.empty p{font-size:13.5px; line-height:1.55; margin-top:5px}

.trend{display:flex; align-items:flex-end; gap:5px; height:60px; margin-top:10px}
.trend .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; height:100%}
.trend .col .b1{background:var(--out-soft); border-radius:3px 3px 0 0; min-height:2px}
.trend .col .b2{background:var(--in-soft); border-radius:3px 3px 0 0; min-height:2px}
.trendlbl{display:flex; gap:5px; margin-top:5px}
.trendlbl div{flex:1; text-align:center; font-size:9.5px; color:var(--faint); text-transform:uppercase; font-weight:620}

.disc{font-size:11.5px; color:var(--faint); line-height:1.55; padding:14px 2px 0}
details.acc{border-top:1px solid var(--line); padding:12px 0}
details.acc summary{font-weight:600; font-size:14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'+'; color:var(--muted); font-size:18px; font-weight:400}
details.acc[open] summary::after{content:'–'}
details.acc .c{font-size:13px; color:var(--muted); line-height:1.6; padding-top:9px}
details.acc .c p+p{margin-top:8px}
details.acc .c b{color:var(--text)}

.swipe{display:flex; gap:8px; margin-top:10px}
.swipe button{flex:1; padding:9px; border-radius:10px; background:var(--surface2); border:1px solid var(--line); font-size:13px; font-weight:600}
.swipe button.del{color:var(--danger)}
/* ================= gatinhos pretos ================= */
.cat{display:block; width:100%; height:auto}
.catwrap{display:flex; justify-content:center; margin:0 auto}
.cat-xs{width:22px;height:22px;flex:none}
.cat-sm{width:44px;height:44px;flex:none}
.cat-md{width:96px}
.cat-lg{width:132px}
/* gato preto sobre fundo escuro precisa de contorno de luz */
:root[data-theme="dark"] .cat{filter:drop-shadow(0 0 1.6px var(--cat-rim)) drop-shadow(0 0 7px rgba(255,255,255,.10))}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .cat{filter:drop-shadow(0 0 1.6px var(--cat-rim)) drop-shadow(0 0 7px rgba(255,255,255,.10))}
}
:root[data-theme="light"] .cat{filter:none}

.catstage{position:relative; display:grid; place-items:center; padding:6px 0 2px}
.catstage::before{content:''; position:absolute; width:118px; height:118px; border-radius:50%;
  background:var(--cat-halo); z-index:0}
.catstage .cat{position:relative; z-index:1}

/* gato espiando por cima de um card */
.peekwrap{position:relative; margin-top:26px}
.peekwrap .peek{position:absolute; top:-25px; right:16px; width:74px; z-index:2; pointer-events:none}
.peekwrap>.card,.peekwrap>.hero{margin-top:0}

.pawline{display:flex; align-items:center; gap:7px; color:var(--faint)}
.pawline svg{width:14px;height:14px;flex:none}

/* ================= aprender ================= */
.searchbar{position:relative; margin-bottom:12px}
.searchbar input{width:100%; padding:14px 44px 14px 44px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); font-size:16px; outline:none; box-shadow:var(--shadow)}
.searchbar input:focus{border-color:var(--accent)}
.searchbar .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--faint)}
.searchbar .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px;
  border-radius:50%; display:none; place-items:center; color:var(--muted); background:var(--sunken)}
.searchbar .clr svg{width:14px;height:14px}
.searchbar.has .clr{display:grid}

.art{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:9px;
  box-shadow:var(--shadow); overflow:hidden}
.art>summary{list-style:none; cursor:pointer; padding:14px 15px; display:flex; gap:11px; align-items:flex-start}
.art>summary::-webkit-details-marker{display:none}
.art .qi{width:26px;height:26px;flex:none;border-radius:8px;background:var(--accent-soft);
  display:grid;place-items:center;color:var(--accent-ink)}
.art .qi svg{width:15px;height:15px}
.art .qt{flex:1; min-width:0}
.art .qt b{display:block; font-weight:640; font-size:14.5px; line-height:1.35}
.art .qt span{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45}
.art .chev{color:var(--faint); font-size:19px; line-height:1; margin-top:2px; flex:none; transition:transform .2s}
.art[open] .chev{transform:rotate(45deg)}
.art .ab{padding:2px 15px 16px; font-size:13.5px; line-height:1.65; color:var(--muted)}
.art .ab p{margin:0 0 9px}
.art .ab p:last-child{margin-bottom:0}
.art .ab b{color:var(--text); font-weight:640}
.art .ab ul{margin:0 0 9px; padding-left:18px}
.art .ab li{margin-bottom:5px}
.art .ab .tip{background:var(--accent-soft); color:var(--accent-ink); border-radius:11px; padding:11px 12px; margin:10px 0 0}
.art .ab .tip b{color:var(--accent-ink)}
.art .ab .alerta{background:var(--out-soft); color:var(--out); border-radius:11px; padding:11px 12px; margin:10px 0 0}
.art .ab .alerta b{color:var(--out)}
.art .ab .num{font-variant-numeric:tabular-nums; font-weight:640; color:var(--text)}
.art .goto{display:inline-flex; align-items:center; gap:6px; margin-top:11px; font-size:13px;
  font-weight:640; color:var(--accent); text-decoration:underline; text-underline-offset:3px}

.catcount{font-size:12px; color:var(--faint); margin:2px 0 10px; font-weight:560}
.faqhd{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:650; margin:20px 0 10px; display:flex; align-items:center; gap:7px}
.faqhd svg{width:14px;height:14px;color:var(--faint)}

/* ================= navegacao com icones ================= */
nav button .e{display:none}
nav button svg{width:21px;height:21px}
nav button.on svg{color:var(--accent)}
.topbtns{display:flex; gap:8px; align-items:center; flex:none}
.iconbtn svg{width:18px;height:18px;color:var(--muted)}
.iconbtn.on svg{color:var(--accent)}

/* ================= pagos con fecha ================= */
.pend{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:none}
.pend .pd{flex:1; min-width:0}
.pend .nm{font-weight:570; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pend .dt{font-size:12px; margin-top:2px; font-weight:620; line-height:1.35}
.pend .pa{font-weight:650; font-size:15px; white-space:nowrap; letter-spacing:-.01em}
.pend.ok .nm,.pend.ok .pa{color:var(--faint); text-decoration:line-through}
.pend .pb{padding:8px 14px; border-radius:99px; background:var(--accent); color:var(--on-accent);
  font-size:12.5px; font-weight:650; flex:none}
.pend .pb.done{background:transparent; color:var(--accent); font-size:17px; padding:6px 8px}
.pend .pb:active{transform:scale(.96)}
</style>
</head>

/* ---------- utilidades ---------- */
function ymHoy(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ var v=Math.round(Math.abs(n||0)); return '$'+v.toLocaleString('es-CO'); }
function moneyS(n){ return (n<0?'−':'')+money(n); }
function corto(n){
  n = Math.abs(Math.round(n||0));
  if(n>=1000000) return '$'+(n/1000000).toFixed(n>=10000000?0:1).replace('.',',')+'M';
  if(n>=1000) return '$'+Math.round(n/1000)+'k';
  return '$'+n;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nomMes(ym){ var p=ym.split('-'); return MESES[+p[1]-1]+' '+p[0]; }
function fechaCorta(iso){
  var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var dif=Math.round((hoy-d)/86400000);
  if(dif===0) return 'Hoy'; if(dif===1) return 'Ayer';
  return +p[2]+' '+MES_C[+p[1]-1].toLowerCase();
}
function diasEnMes(ym){ var p=ym.split('-'); return new Date(+p[0],+p[1],0).getDate(); }

var LS_KEY='miplata_v1';
var idb=null;

function abrirIDB(){
  return new Promise(function(res){
    try{
      if(!window.indexedDB) return res(null);
      var r=indexedDB.open('miplata',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ res(null); };
      setTimeout(function(){ res(null); },2500);
    }catch(e){ res(null); }
  });
}
function idbGet(){
  return new Promise(function(res){
    if(!idb) return res(null);
    try{ var t=idb.transaction('kv','readonly').objectStore('kv').get('state');
      t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbPut(o){
  try{ if(idb) idb.transaction('kv','readwrite').objectStore('kv').put(o,'state'); }catch(e){}
}
var STORAGE_OK=true;
function probarAlmacenamiento(){
  try{
    var k='__mp_probe__';
    localStorage.setItem(k,'1');
    var v=localStorage.getItem(k);
    localStorage.removeItem(k);
    return v==='1';
  }catch(e){ return false; }
}
function lsGet(){ try{ var r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsPut(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function semilla(){

/* =========================================================================
   CÁLCULOS
   ========================================================================= */
function movsDe(ym){ return S.mov.filter(function(m){ return m.fecha.slice(0,7)===ym; }); }

function resumen(ym){
  var r={ing:0,gas:0,aho:0,ess:0,noEss:0,porCat:{}};
  movsDe(ym).forEach(function(m){
    if(m.tipo==='in'){ r.ing+=m.monto; }
    else if(m.tipo==='save'){ r.aho+=m.monto; }
    else{
      r.gas+=m.monto;
      var c=CAT_MAP[m.cat];
      if(c && c.ess) r.ess+=m.monto; else r.noEss+=m.monto;
      r.porCat[m.cat]=(r.porCat[m.cat]||0)+m.monto;
    }
  });
  r.saldo = r.ing - r.gas - r.aho;
  return r;
}

function mesesConDatos(){
  var s={}; S.mov.forEach(function(m){ s[m.fecha.slice(0,7)]=1; });
  return Object.keys(s).sort();
}
/* promedio de los meses completos anteriores (máx 3); si no hay, usa el mes actual */
function base(){
  var hoy=ymHoy();
  var ms=mesesConDatos().filter(function(m){ return m<hoy; }).slice(-3);
  var ing=0, ess=0, noEss=0, gas=0;
  if(ms.length){
    ms.forEach(function(m){ var r=resumen(m); ing+=r.ing; ess+=r.ess; noEss+=r.noEss; gas+=r.gas; });
    ing/=ms.length; ess/=ms.length; noEss/=ms.length; gas/=ms.length;
  }else{
    var r=resumen(hoy); ing=r.ing; ess=r.ess; noEss=r.noEss; gas=r.gas;
  }
  if(ing<=0 && S.perfil.ingresoEsperado>0) ing=S.perfil.ingresoEsperado;
  return {ing:ing, ess:ess, noEss:noEss, gas:gas, meses:ms.length, estimado:(ms.length===0)};
}

function ahorroTotal(){
  var t=0; S.mov.forEach(function(m){ if(m.tipo==='save') t+=m.monto; }); return t;
}
function colchon(){
  var t=0; S.mov.forEach(function(m){ if(m.tipo==='save' && (!m.destino||m.destino==='colchon')) t+=m.monto; });
  return t;
}
function ahorradoMeta(id){
  var t=0; S.mov.forEach(function(m){ if(m.tipo==='save' && m.destino===id) t+=m.monto; }); return t;
}
function deudasCaras(){ return S.deudas.filter(function(d){ return (d.tasa||0) >= REF.usura; }); }
function totalDeuda(l){ return (l||S.deudas).reduce(function(a,d){ return a+(d.saldo||0); },0); }
function interesMensual(d){ return (d.saldo||0) * (Math.pow(1+(d.tasa||0)/100, 1/12) - 1); }

/* ---- motor del plan: escalera de prioridades ---- */
function plan(){
  var b=base();
  var disponible = b.ing - b.ess - b.noEss;
  var pct = S.ajustes.metaAhorroPct/100;
  var ideal = b.ing * pct;
  var sugerido = Math.max(0, Math.min(ideal, disponible));
  var caras = deudasCaras();
  var col = colchon();
  var colchonMin = 1000000;
  var colchonMeta = Math.max(b.ess,1) * S.ajustes.colchonMeses;

  var pasos=[];
  pasos.push({
    t:'Colchón anti-susto', meta:colchonMin, act:Math.min(col,colchonMin),
    d:'Un millón guardado y disponible. Es lo que evita que un imprevisto (el celular, una urgencia médica, el bus dañado) se convierta en una deuda con tarjeta.'
  });
  pasos.push({
    t:'Matar las deudas caras', meta:totalDeuda(caras), act:0, deuda:true,
    d: caras.length
        ? 'Tienes '+caras.length+' deuda'+(caras.length>1?'s':'')+' por encima del '+REF.usura+'% E.A. Ninguna inversión legal en Colombia te paga eso, así que pagarlas es la mejor "inversión" que existe.'
        : 'No registraste deudas caras. Si tienes tarjeta de crédito o un gota a gota, agrégalo aquí para verlo.'
  });
  pasos.push({
    t:'Colchón de '+S.ajustes.colchonMeses+' meses', meta:colchonMeta, act:Math.min(col,colchonMeta),
    d:'Con '+money(colchonMeta)+' cubres '+S.ajustes.colchonMeses+' meses de tus gastos indispensables. Es tu red si te quedas sin ingresos.'
  });
  var metasAct = S.metas.filter(function(m){ return ahorradoMeta(m.id) < m.objetivo; });
  pasos.push({
    t: metasAct.length ? 'Tus metas' : 'Ponte una meta',
    meta: metasAct.reduce(function(a,m){ return a+m.objetivo; },0),
    act: metasAct.reduce(function(a,m){ return a+ahorradoMeta(m.id); },0),
    d: metasAct.length ? 'Viaje, estudio, computador, mudanza: lo que estés persiguiendo.'
                       : 'Ahorrar sin nombre es difícil. Ponle nombre y fecha a lo que quieres.'
  });
  pasos.push({
    t:'Largo plazo', meta:0, act:0,
    d:'Con el colchón lleno y sin deudas caras, lo que sobra puede ir a plazos más largos y con más riesgo. Mira la pestaña Invertir.'
  });

  /* paso actual */
  var idx=0;
  if(col >= colchonMin){
    idx=1;
    if(totalDeuda(caras) <= 0){
      idx=2;
      if(col >= colchonMeta){
        idx=3;
        if(!metasAct.length || pasos[3].act >= pasos[3].meta) idx=4;
      }
    }
  }
  pasos.forEach(function(p,i){ p.estado = i<idx ? 'done' : (i===idx?'now':''); });

  /* modo rescate */
  var rescate=null;
  if(disponible < 0){
    var r=resumen(VISTA.mes), top=[];
    Object.keys(r.porCat).forEach(function(k){
      var c=CAT_MAP[k]; if(c && !c.ess) top.push({c:c, v:r.porCat[k]});
    });
    top.sort(function(a,b){ return b.v-a.v; });
    rescate={ hueco:-disponible, top:top.slice(0,3) };
  }

  return {b:b, disponible:disponible, ideal:ideal, sugerido:sugerido, pct:pct,
          pasos:pasos, idx:idx, col:col, colchonMin:colchonMin, colchonMeta:colchonMeta,
          caras:caras, rescate:rescate, metasAct:metasAct};
}

  var cats=[];

  cats.sort(function(a,b){ return b.v-a.v; });
  var max = cats.length?cats[0].v:1;

  document.getElementById('movResumen').innerHTML =
    '<div class="card"><div class="row"><div>'+
      '<div class="s12 muted">Saldo de '+nomMes(ym)+'</div>'+
      '<div class="tnum" style="font-size:26px;font-weight:700;letter-spacing:-.02em'+(r.saldo<0?';color:var(--out)':'')+'">'+moneyS(r.saldo)+'</div></div>'+
      '<div class="s12 muted" style="text-align:right;line-height:1.7">'+
        '<div><b style="color:var(--in)">'+corto(r.ing)+'</b> entró</div>'+
        '<div><b style="color:var(--out)">'+corto(r.gas)+'</b> gastado</div>'+
        '<div><b style="color:var(--save)">'+corto(r.aho)+'</b> guardado</div>'+
      '</div></div>'+
      (r.gas>0 ? '<div class="bar mt16">'+
        '<i class="a" style="width:'+(r.ess/(r.ing||r.gas)*100)+'%"></i>'+
        '<i style="background:var(--warn);width:'+(r.noEss/(r.ing||r.gas)*100)+'%"></i>'+
        '<i class="b" style="width:'+(r.aho/(r.ing||r.gas)*100)+'%"></i></div>'+
        '<div class="row mt8 s12 muted"><span>🟥 Indispensable '+corto(r.ess)+'</span>'+
        '<span>🟧 Gustos '+corto(r.noEss)+'</span><span>🟪 Ahorro '+corto(r.aho)+'</span></div>' : '')+
    '</div>'+
    (cats.length ? '<div class="card"><h3>En qué se te fue</h3>'+cats.map(function(x){
      return '<div class="catrow"><div class="e">'+x.c.e+'</div><div class="g">'+
        '<div class="t"><span>'+esc(x.c.n)+'</span><b class="tnum">'+money(x.v)+'</b></div>'+
        '<div class="mini"><i class="'+(x.c.ess?'ess':'')+'" style="width:'+(x.v/max*100)+'%"></i></div>'+
      '</div></div>'; }).join('')+
      '<div class="s12 faint mt8">Verde = indispensable · Naranja = se puede recortar</div></div>' : '')+
    trendHTML() + pendMesHTML(ym);

  var lista=movsDe(ym).filter(function(m){ return VISTA.filtro==='todo'||m.tipo===VISTA.filtro; })
    .sort(function(a,b){ return b.fecha.localeCompare(a.fecha) || (b.creado||'').localeCompare(a.creado||''); });

  document.getElementById('movLista').innerHTML = lista.length
    ? '<div class="card">'+lista.map(itemHTML).join('')+'</div>'
    : '<div class="empty"><div class="catstage"><svg class="cat cat-md" viewBox="0 0 120 120"><use href="#cat-sleep"/></svg></div>'+
      '<b>Nada registrado en '+nomMes(ym)+'</b><p>Toca <b>+</b> para agregar.</p></div>';
}

function trendHTML(){
  var ms=mesesConDatos().slice(-6);
  if(ms.length<2) return '';
  var datos=ms.map(function(m){ var r=resumen(m); return {m:m, ing:r.ing, gas:r.gas+r.aho}; });
  var max=Math.max.apply(null, datos.map(function(d){ return Math.max(d.ing,d.gas); }))||1;
  return '<div class="card"><h3>Últimos meses</h3><div class="trend">'+
    datos.map(function(d){
      return '<div class="col"><div class="b2" style="height:'+(d.ing/max*100)+'%"></div>'+
             '<div class="b1" style="height:'+(d.gas/max*100)+'%"></div></div>'; }).join('')+
    '</div><div class="trendlbl">'+datos.map(function(d){
      return '<div>'+MES_C[+d.m.split('-')[1]-1]+'</div>'; }).join('')+'</div>'+
    '<div class="s12 faint mt8">Barra clara arriba = lo que entró · Barra rosada abajo = lo que salió</div></div>';
}

function abrirMes(){
  var ms=mesesConDatos(); if(ms.indexOf(ymHoy())<0) ms.push(ymHoy());
  var hy=new Date(), sig=new Date(hy.getFullYear(), hy.getMonth()+1, 1);
  var ymSig=sig.getFullYear()+'-'+pad(sig.getMonth()+1);
  if(ms.indexOf(ymSig)<0) ms.push(ymSig);
  ms.sort().reverse();
  sheet('Elige el mes',
    ms.map(function(m){
      return '<button class="btn '+(m===VISTA.mes?'soft':'ghost')+'" style="margin-bottom:8px" '+
        'onclick="VISTA.mes=\''+m+'\';cerrarSheet();pintarMov()">'+nomMes(m)+'</button>'; }).join(''));
}

/* =========================================================================
   PANTALLA: PLAN
   ========================================================================= */
function pintarPlan(){
  var p=plan(), b=p.b;
  var out='';

  if(b.ing<=0){
    out += '<div class="empty"><div class="catstage"><svg class="cat cat-md" viewBox="0 0 120 120"><use href="#cat-sit"/></svg></div><b>Necesito saber cuánto entra</b>'+
      '<p>Registra tus ingresos del mes con el botón <b>+</b>, o dime cuánto esperas ganar al mes para calcular tu plan.</p>'+
      '<button class="btn soft mt16" onclick="editarPerfil()">Decir cuánto gano al mes</button></div>';
    document.getElementById('planBox').innerHTML=out; return;
  }

  /* rescate */
  if(p.rescate){
    out += '<div class="card" style="border-color:var(--out)">'+
      '<div class="row" style="align-items:flex-start">'+
        '<h3 style="color:var(--out);margin:0">Primero: cerrar el hueco</h3>'+
        '<svg class="cat" style="width:58px;flex:none;margin:-6px -2px 0 0" viewBox="0 0 120 100"><use href="#cat-alert"/></svg>'+
      '</div>'+
      '<div class="s14">Cada mes gastas <b style="color:var(--out)">'+money(p.rescate.hueco)+'</b> más de lo que ganas. '+
      'Ahorrar es imposible mientras eso pase — el objetivo de este mes no es guardar, es llegar a cero.</div>'+
      (p.rescate.top.length
        ? '<div class="mt12 s13 muted">Donde más rápido puedes recortar:</div>'+
          p.rescate.top.map(function(x){
            return '<div class="row mt8 s14"><span>'+x.c.e+' '+esc(x.c.n)+'</span><b class="tnum" style="color:var(--out)">'+money(x.v)+'</b></div>';
          }).join('')
        : '')+
      '</div>';
  }

  /* cuánto guardar */
  var pctReal = b.ing>0 ? p.sugerido/b.ing*100 : 0;
  out += '<div class="card">'+
    '<h3>Cuánto guardar al mes</h3>'+
    '<div style="font-size:33px;font-weight:700;letter-spacing:-.03em" class="tnum">'+money(p.sugerido)+'</div>'+
    '<div class="s13 muted mt8">'+
      (p.sugerido<=0
        ? 'Con tus números de ahora no sobra nada. No es un fracaso: es información. Empieza recortando lo no esencial.'
        : (p.sugerido < p.ideal
            ? 'Tu meta es el '+S.ajustes.metaAhorroPct+'% ('+money(p.ideal)+'), pero con tus gastos actuales lo realista es '+
              Math.round(pctReal)+'%. Mejor guardar '+money(p.sugerido)+' todos los meses que prometerte '+money(p.ideal)+' y no lograrlo.'
            : 'Es el '+S.ajustes.metaAhorroPct+'% de lo que ganas. Sepáralo apenas te caiga la plata, no al final del mes.'))+
    '</div>'+
    '<div class="mt16" style="border-top:1px solid var(--line);padding-top:12px">'+
      '<div class="kv"><span>Entra al mes'+(b.estimado?' <span class="faint">(estimado)</span>':'')+'</span><b class="tnum">'+money(b.ing)+'</b></div>'+
      '<div class="kv"><span>Gastos indispensables</span><b class="tnum">'+money(b.ess)+'</b></div>'+
      '<div class="kv"><span>Gustos y extras</span><b class="tnum">'+money(b.noEss)+'</b></div>'+
      '<div class="kv big"><span>Te sobra</span><b class="tnum" '+(p.disponible<0?'style="color:var(--out)"':'')+'>'+moneyS(p.disponible)+'</b></div>'+
    '</div>'+
    (b.meses>0 ? '<div class="s12 faint mt8">Promedio de tus últimos '+b.meses+' mes'+(b.meses>1?'es':'')+'.</div>'
               : '<div class="s12 faint mt8">Con más meses registrados, estos números se vuelven mucho más precisos.</div>')+
  '</div>';

  /* 50/30/20 */
  var t=b.ess+b.noEss+p.sugerido;
  if(t>0){
    var a1=b.ess/b.ing*100, a2=b.noEss/b.ing*100, a3=p.sugerido/b.ing*100;
    out += '<div class="card"><h3>Cómo se reparte tu plata</h3>'+
      '<div class="bar" style="height:13px"><i class="a" style="width:'+Math.min(100,a1)+'%"></i>'+
      '<i style="background:var(--warn);width:'+Math.min(100,a2)+'%"></i>'+
      '<i class="b" style="width:'+Math.min(100,a3)+'%"></i></div>'+
      '<div class="mt12">'+
        cmpRow('Indispensable', a1, 50, 'var(--out)')+
        cmpRow('Gustos', a2, 30, 'var(--warn)')+
        cmpRow('Ahorro', a3, S.ajustes.metaAhorroPct, 'var(--save)')+
      '</div>'+
      '<div class="s12 faint mt8">La referencia clásica es 50 / 30 / '+S.ajustes.metaAhorroPct+'. Es una guía, no una regla: '+
      'en ciudades caras el arriendo solo ya se lleva más del 50%.</div></div>';
  }

  /* escalera */
  out += '<div class="card"><h3>El orden importa</h3>'+
    p.pasos.map(function(s,i){
      return '<div class="step '+s.estado+'"><div class="n">'+(s.estado==='done'?'✓':(i+1))+'</div><div>'+
        '<div class="ti">'+esc(s.t)+'</div><div class="de">'+esc(s.d)+'</div>'+
        (s.meta>0 && s.estado!=='done' ? '<div class="pill">Faltan '+money(Math.max(0,s.meta-s.act))+'</div>' : '')+
        (s.estado==='done' ? '<div class="pill" style="background:var(--accent-soft);color:var(--accent-ink)">Listo ✓</div>' : '')+
      '</div></div>'; }).join('')+
  '</div>';

  /* colchón */
  out += '<div class="card"><div class="row"><h3 style="margin:0">Mi colchón</h3>'+
    '<button class="chip" onclick="abrirAdd(\'save\')">+ Guardar</button></div>'+
    '<div class="row" style="align-items:flex-end;gap:8px">'+
      '<div><div style="font-size:27px;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px" class="tnum">'+money(p.col)+'</div>'+
      '<div class="s13 muted">Meta: '+money(p.colchonMeta)+' ('+S.ajustes.colchonMeses+' meses de gastos indispensables)</div></div>'+
      '<svg class="cat" style="width:76px;flex:none" viewBox="0 0 120 120"><use href="#cat-sleep"/></svg>'+
    '</div>'+
    '<div class="bar mt12"><i class="c" style="width:'+Math.min(100,p.colchonMeta?p.col/p.colchonMeta*100:0)+'%"></i></div>'+
    '<div class="banner ok mt12"><span class="e">👜</span><div>Guárdalo en un <b>Bolsillo</b> de tu app '+
    'Bancolombia. Es gratis y esa plata deja de sumar a tu saldo disponible, así no te la gastas sin pensar.</div></div>'+
  '</div>';

  /* metas */
  out += '<div class="card"><div class="row"><h3 style="margin:0">Mis metas</h3>'+
    '<button class="chip" onclick="editarMeta()">+ Nueva</button></div>'+
    (S.metas.length ? S.metas.map(function(g){
      var ah=ahorradoMeta(g.id), pc=g.objetivo?Math.min(100,ah/g.objetivo*100):0;
      var falta=Math.max(0,g.objetivo-ah);
      var porMes = p.sugerido>0 ? p.sugerido : 0;
      var eta = (falta>0 && porMes>0) ? Math.ceil(falta/porMes) : 0;
      return '<div class="goal" onclick="editarMeta(\''+g.id+'\')">'+
        '<div class="hd"><span class="e">'+(g.emoji||'🎯')+'</span><span class="nm">'+esc(g.nombre)+'</span>'+
        '<span class="pc tnum">'+Math.round(pc)+'%</span></div>'+
        '<div class="bar"><i class="c" style="width:'+pc+'%"></i></div>'+
        '<div class="ft"><span class="tnum">'+money(ah)+' de '+money(g.objetivo)+'</span>'+
        '<span>'+(falta<=0?'¡Lograda! 🐾':(eta?'≈ '+eta+' mes'+(eta>1?'es':''):'Faltan '+money(falta)))+'</span></div>'+
      '</div>'; }).join('')
      : '<div class="s13 muted mt8">Ahorrar «porque sí» casi nunca funciona. Ponle nombre: un viaje, un computador, el semestre, mudarte.</div>')+
  '</div>';

  /* deudas */
  var intTot=S.deudas.reduce(function(a,d){ return a+interesMensual(d); },0);
  out += '<div class="card"><div class="row"><h3 style="margin:0">Mis deudas</h3>'+
    '<button class="chip" onclick="editarDeuda()">+ Agregar</button></div>'+
    (S.deudas.length
      ? '<div class="s13 muted mt8">Págalas de mayor a menor tasa: así pagas menos intereses en total.</div>'+
        S.deudas.slice().sort(function(a,b){ return (b.tasa||0)-(a.tasa||0); }).map(function(d){
          var im=interesMensual(d);
          return '<div class="item" onclick="editarDeuda(\''+d.id+'\')">'+
            '<div class="ic '+((d.tasa||0)>=REF.usura?'out':'')+'">'+((d.tasa||0)>=REF.usura?'🔥':'💳')+'</div>'+
            '<div style="min-width:0"><div class="nm">'+esc(d.nombre)+'</div>'+
            '<div class="dt">'+(d.tasa||0).toString().replace('.',',')+'% E.A. · te cuesta '+money(im)+'/mes en intereses'+
            (d.cuota>0&&d.dia>0 ? '<br>Cuota '+money(d.cuota)+' el día '+d.dia : '')+'</div></div>'+
            '<div class="amt out tnum">'+money(d.saldo)+'</div></div>'; }).join('')+
        '<div class="banner '+(intTot>0?'bad':'ok')+' mt12"><span class="e">🔥</span><div>'+
        'Solo en intereses, tus deudas te cuestan <b>'+money(intTot)+' al mes</b> — '+money(intTot*12)+' al año. '+
        'Eso es plata que se va sin comprarte nada.</div></div>'+
        '<div class="s12 faint mt8">De cada cuota que registras, Mi Plata descuenta primero los intereses del mes '+
        'y baja el saldo con el resto. Es un estimado: si vuelves a usar la tarjeta o te cobran algo extra, '+
        'el saldo real cambia. Compáralo con tu extracto de vez en cuando y corrígelo aquí.</div>'
      : '<div class="s13 muted mt8">Si tienes tarjeta de crédito, un crédito de libre inversión o un gota a gota, agrégalo. '+
        'Saber cuánto te cuestan al mes cambia las prioridades.</div>')+
  '</div>';

  /* gastos fijos */
  var totFijos=S.fijos.reduce(function(a,f){ return a+(f.monto||0); },0);
  out += '<div class="card"><div class="row"><h3 style="margin:0">Pagos fijos del mes</h3>'+
    '<button class="chip" onclick="editarFijo()">+ Agregar</button></div>'+
    (S.fijos.length
      ? S.fijos.slice().sort(function(a,b){ return a.dia-b.dia; }).map(function(f){
          var c=CAT_MAP[f.cat]||{e:'📦',n:'Otros'};
          return '<div class="item" onclick="editarFijo(\''+f.id+'\')">'+
            '<div class="ic out">'+c.e+'</div>'+
            '<div style="min-width:0"><div class="nm">'+esc(f.nombre)+'</div>'+
            '<div class="dt">Vence el '+f.dia+' de cada mes</div></div>'+
            '<div class="amt out tnum">'+money(f.monto)+'</div></div>'; }).join('')+
        '<div class="row mt12 s13"><span class="muted">Total fijo al mes</span>'+
        '<b class="tnum">'+money(totFijos)+'</b></div>'
      : '<div class="s13 muted mt8">El arriendo, los servicios, el gimnasio. Al ponerles fecha, '+
        'Mi Plata te avisa antes de que venzan y calcula si te va a alcanzar.</div>')+
  '</div>';

  /* ajuste de meta */
  out += '<div class="card flat"><h3>Ajustar mi plan</h3>'+
    '<label class="f">Quiero ahorrar este % de lo que gano</label>'+
    '<input class="f" type="number" min="1" max="80" value="'+S.ajustes.metaAhorroPct+'" '+
      'onchange="S.ajustes.metaAhorroPct=Math.max(1,Math.min(80,+this.value||20));pintarTodo()">'+
    '<label class="f">Quiero un colchón de cuántos meses</label>'+
    '<select class="f" onchange="S.ajustes.colchonMeses=+this.value;pintarTodo()">'+
      [1,2,3,4,5,6].map(function(m){ return '<option value="'+m+'"'+(S.ajustes.colchonMeses===m?' selected':'')+'>'+m+' mes'+(m>1?'es':'')+'</option>'; }).join('')+
    '</select>'+
    '<button class="btn ghost mt16" onclick="editarPerfil()">Cambiar mi nombre / ingreso esperado</button>'+
  '</div>';

  document.getElementById('planBox').innerHTML=out;
}
function cmpRow(nm, real, ideal, col){
  var d=real-ideal;
  return '<div class="row s13" style="padding:6px 0">'+
    '<span><b style="color:'+col+'">■</b> '+nm+'</span>'+
    '<span class="tnum"><b>'+Math.round(real)+'%</b> <span class="faint">/ '+Math.round(ideal)+'% ideal</span>'+
    (Math.abs(d)>=5 ? ' <span style="color:'+(d>0&&nm!=='Ahorro'?'var(--out)':'var(--accent)')+'">'+(d>0?'+':'')+Math.round(d)+'</span>' : '')+
    '</span></div>';
}

   PANTALLA: INVERTIR

function pintarInv(){
  var p=plan();
  var col=p.col, listo = col>=p.colchonMeta && totalDeuda(p.caras)<=0;

      : '<b>Antes de invertir, la base.</b> '+
        (totalDeuda(p.caras)>0 ? 'Tienes '+money(totalDeuda(p.caras))+' en deuda cara — pagarla te «rinde» más que cualquier inversión. '

function fmtNum(n){ return Math.round(n).toLocaleString('es-CO'); }
function unfmt(s){ return +String(s).replace(/[^\d]/g,'')||0; }
function fmtIn(el){
  var v=unfmt(el.value); var pos=el.value.length-el.selectionStart;
  el.value = v?fmtNum(v):'';
  try{ el.selectionStart=el.selectionEnd=Math.max(0,el.value.length-pos); }catch(e){}
}
function num(id){ var e=document.getElementById(id); return e?+String(e.value).replace(',','.').replace(/\.(?=\d{3}\b)/g,'')||0:0; }

function calc1(){
  var m=unfmt((document.getElementById('c1m')||{}).value||0);
  var t=+String((document.getElementById('c1t')||{}).value||0).replace(',','.')||0;
  var p=+String((document.getElementById('c1p')||{}).value||0).replace(/[^\d]/g,'')||0;
  S._c1m=(document.getElementById('c1m')||{}).value; S._c1t=(document.getElementById('c1t')||{}).value; S._c1p=(document.getElementById('c1p')||{}).value;
  var el=document.getElementById('c1out'); if(!el) return;
  if(!m||!p){ el.innerHTML='<div class="s13 faint">Llena los campos para ver el resultado.</div>'; return; }
  var fin = m*Math.pow(1+t/100, p/12);
  var gana = fin-m;
  var infl = m*Math.pow(1+S.ajustes.inflacion/100, p/12);
  var real = fin-infl;
  el.innerHTML =
    '<div class="kv"><span>Al final tendrías</span><b class="tnum">'+money(fin)+'</b></div>'+
    '<div class="kv"><span>Ganancia</span><b class="tnum" style="color:var(--accent)">+'+money(gana)+'</b></div>'+
    '<div class="kv big"><span>Ganancia real<br><span class="s12 faint" style="font-weight:400">descontando la inflación</span></span>'+
      '<b class="tnum" style="color:'+(real>=0?'var(--accent)':'var(--out)')+'">'+(real>=0?'+':'−')+money(real)+'</b></div>'+
    '<div class="s12 faint mt8">'+(real>=0
      ? 'Tu plata gana más rápido de lo que suben los precios. Bien.'
      : 'A esa tasa pierdes poder de compra: los precios suben más rápido. Busca al menos '+Math.ceil(S.ajustes.inflacion)+'% E.A.')+
    '</div>'+
    '<div class="s12 faint mt8">No incluye retención en la fuente sobre rendimientos ni la cuota de manejo, si aplican.</div>';
}
function calc2(){
  var m=unfmt((document.getElementById('c2m')||{}).value||0);
  var t=+String((document.getElementById('c2t')||{}).value||0).replace(',','.')||0;
  var a=+String((document.getElementById('c2a')||{}).value||0).replace(/[^\d]/g,'')||0;
  S._c2m=(document.getElementById('c2m')||{}).value; S._c2t=(document.getElementById('c2t')||{}).value; S._c2a=(document.getElementById('c2a')||{}).value;
  var el=document.getElementById('c2out'); if(!el) return;
  if(!m||!a){ el.innerHTML='<div class="s13 faint">Llena los campos para ver el resultado.</div>'; return; }
  var n=a*12, i=Math.pow(1+t/100,1/12)-1;
  var fin = i>0 ? m*((Math.pow(1+i,n)-1)/i) : m*n;
  var puesto=m*n;
  el.innerHTML =
    '<div class="kv"><span>Vas a poner en total</span><b class="tnum">'+money(puesto)+'</b></div>'+
    '<div class="kv"><span>Intereses ganados</span><b class="tnum" style="color:var(--accent)">+'+money(fin-puesto)+'</b></div>'+
    '<div class="kv big"><span>Tendrías en '+a+' año'+(a>1?'s':'')+'</span><b class="tnum">'+money(fin)+'</b></div>'+
    '<div class="s12 faint mt8">'+money(m)+' al mes parecen poco, pero '+money(fin)+' en '+a+' año'+(a>1?'s':'')+' no lo son.</div>';
}
function calc3(){
  var m=unfmt((document.getElementById('c3m')||{}).value||0);
  S._c3m=(document.getElementById('c3m')||{}).value;
  var el=document.getElementById('c3out'); if(!el) return;
  if(!m){ el.innerHTML=''; return; }
  var gravado=Math.max(0, m-REF.gmfExento);
  var imp=gravado*0.004;
  el.innerHTML =
    '<div class="kv"><span>Exento</span><b class="tnum">'+money(Math.min(m,REF.gmfExento))+'</b></div>'+
    '<div class="kv"><span>Sobre lo que te cobran</span><b class="tnum">'+money(gravado)+'</b></div>'+
    '<div class="kv big"><span>4x1000 al mes</span><b class="tnum" style="color:'+(imp>0?'var(--out)':'var(--accent)')+'">'+money(imp)+'</b></div>'+
    (imp>0 ? '<div class="s12 faint mt8">Son '+money(imp*12)+' al año.</div>'
           : '<div class="s12 mt8" style="color:var(--accent)">Estás por debajo del tope: no pagas 4x1000. 👌</div>');
}

function paqueteJSON(){
  var copia=JSON.parse(JSON.stringify(S));
  Object.keys(copia).forEach(function(k){ if(k.charAt(0)==='_') delete copia[k]; });
  copia.exportado=new Date().toISOString();
  return JSON.stringify(copia);
}
function nombreArchivo(ext){
  var d=new Date();
  return 'MiPlata-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.'+ext;
}
function marcarRespaldo(){
  S.ajustes.ultimoRespaldo=new Date().toISOString();
  S.ajustes.movsDesdeRespaldo=0; guardar(); pintar();
}
function bajar(txt, nombre, tipo){
  try{
    var b=new Blob([txt],{type:tipo||'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },1200);
    return true;
  }catch(e){ return false; }
}
function respaldarArchivo(){
  if(bajar(paqueteJSON(), nombreArchivo('json'))){ marcarRespaldo(); toast('Copia descargada ✓'); }
  else toast('No se pudo descargar. Usa «Copiar».');
}
function respaldarCompartir(){
  var txt=paqueteJSON();
  var hecho=false;
  try{
    var f=new File([txt], nombreArchivo('json'), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:'Copia de Mi Plata'})
        .then(function(){ marcarRespaldo(); toast('Copia enviada ✓'); })
        .catch(function(){});
      hecho=true;
    }
  }catch(e){}
  if(!hecho && navigator.share){
    navigator.share({title:'Copia de Mi Plata', text:txt})
      .then(function(){ marcarRespaldo(); toast('Copia enviada ✓'); })
      .catch(function(){});
    hecho=true;
  }
  if(!hecho){
    respaldarCopiar();
    toast('Copiado. Pégalo en un chat contigo misma.');
  }
}
function respaldarCopiar(){
  var txt=paqueteJSON();
  function ok(){ marcarRespaldo(); toast('Copia en el portapapeles ✓'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){ copiarViejo(txt,ok); });
  }else copiarViejo(txt,ok);
}
function copiarViejo(txt,ok){
  var t=document.createElement('textarea'); t.value=txt;
  t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t);
  t.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(t);
}
function exportarApp(){
  var abre='<script id="seed" type="application/json">';
  var i=HTML_ORIGINAL.indexOf(abre);
  if(i<0){ toast('No se pudo generar el archivo'); return; }
  var j=HTML_ORIGINAL.indexOf('<'+'/script>', i);
  if(j<0){ toast('No se pudo generar el archivo'); return; }
  var datos=paqueteJSON().replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var html='<!doctype html>\n'+HTML_ORIGINAL.slice(0,i+abre.length)+datos+HTML_ORIGINAL.slice(j);
  if(bajar(html, nombreArchivo('html'), 'text/html')){
    marcarRespaldo();
    toast('Listo. Guárdalo en Drive o mándatelo.');
  }else toast('No se pudo descargar el archivo');
}
function aplicarRestaurado(o){
  if(!o || Object.prototype.toString.call(o.mov)!=='[object Array]'){ toast('Ese archivo no parece una copia válida'); return; }
  if(!o.mov.length && !confirm('Esa copia no tiene movimientos. ¿Restaurar de todos modos?')) return;
  if(S.mov.length && !confirm('Vas a reemplazar '+S.mov.length+' movimiento(s) de este dispositivo por '+o.mov.length+' de la copia. ¿Seguir?')) return;
  var base=estadoNuevo();
  S={ v:1, updatedAt:new Date().toISOString(),
      perfil:Object.assign(base.perfil, o.perfil||{}),
      mov:o.mov||[], metas:o.metas||[], deudas:o.deudas||[], fijos:o.fijos||[],
      ajustes:Object.assign(base.ajustes, o.ajustes||{}) };
  guardar(); aplicarTema(); ir('inicio');
  toast('Datos restaurados ✓ ('+S.mov.length+' movimientos)');
}
function restaurarArchivo(inp){
  var f=inp.files && inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ aplicarRestaurado(JSON.parse(String(r.result))); }
    catch(e){ toast('No pude leer ese archivo'); }
    inp.value='';
  };
  r.onerror=function(){ toast('No pude leer ese archivo'); };
  r.readAsText(f);
}
function restaurarTexto(){
  var t=(document.getElementById('pegaTxt')||{}).value||'';
  if(!t.trim()){ toast('Pega primero el texto de la copia'); return; }
  try{ aplicarRestaurado(JSON.parse(t.trim())); }
  catch(e){ toast('Ese texto no es una copia válida'); }
}
function borrarTodo(){
  if(!confirm('¿Seguro? Se borra todo lo que has registrado en este dispositivo.')) return;
  if(!confirm('Última confirmación. ¿Tienes una copia guardada? Esto no se puede deshacer.')) return;
  S=estadoNuevo(); guardar(); ir('inicio'); toast('Todo borrado');
}

         fecha:mov.fecha, nota:mov.nota||'', id:mov.id, retiro:mov.monto<0,
         ref:mov.ref||null, refMes:mov.refMes||null, refNombre:mov.nota||''};
  }else{
    ADD={tipo:tipo||'out', monto:'', cat:(tipo==='in'?'salario':'mercado'), destino:'colchon',
         fecha:hoyISO(), nota:'', id:null, retiro:false, ref:null, refMes:null};
  }
  renderAdd();
}
function renderAdd(){
  var v = ADD.monto ? fmtNum(+ADD.monto) : '0';

    h += '<div class="banner ok" style="margin-bottom:12px"><span class="e">\ud83d\udcc5</span><div>'+

  }
  h += '<div class="seg">'+
    [['out','Gasto'],['in','Ingreso'],['save','Guardar']].map(function(t){
      return '<button data-t="'+t[0]+'" class="'+(ADD.tipo===t[0]?'on':'')+'" onclick="cambiarTipo(\''+t[0]+'\')">'+t[1]+'</button>';
    }).join('')+'</div>';

  h += '<div class="amount"><div class="v tnum'+(ADD.monto?'':' zero')+'">$'+v+'</div></div>';

  h += '<div class="pad">'+
    [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button onclick="tecla(\''+n+'\')">'+n+'</button>'; }).join('')+
    '<button class="sec" onclick="tecla(\'000\')">000</button>'+
    '<button onclick="tecla(\'0\')">0</button>'+
    '<button class="sec" onclick="tecla(\'del\')">⌫</button>'+
  '</div>';

  if(ADD.tipo==='save'){
    var destinos=[{id:'colchon',n:'Colchón',e:'🛟'}].concat(S.metas.map(function(m){ return {id:m.id,n:m.nombre,e:m.emoji||'🎯'}; }));
    h += '<label class="f">¿A dónde va?</label><div class="catgrid">'+
      destinos.map(function(d){
        return '<button class="'+(ADD.destino===d.id?'on':'')+'" onclick="ADD.destino=\''+d.id+'\';renderAdd()">'+
          '<span class="e">'+d.e+'</span>'+esc(d.n)+'</button>'; }).join('')+
      '</div>'+
      '<label class="f" style="display:flex;align-items:center;gap:9px;margin-top:14px">'+
      '<input type="checkbox" '+(ADD.retiro?'checked':'')+' onchange="ADD.retiro=this.checked" style="width:19px;height:19px;accent-color:var(--accent)">'+
      '<span style="font-size:13.5px;color:var(--text);font-weight:500">Al contrario: saqué plata de mis ahorros</span></label>';
  }else{
    var lista=CATS[ADD.tipo];
    h += '<label class="f">Categoría</label><div class="catgrid">'+
      lista.map(function(c){
        return '<button class="'+(ADD.cat===c.id?'on':'')+'" onclick="ADD.cat=\''+c.id+'\';renderAdd()">'+
          '<span class="e">'+c.e+'</span>'+esc(c.n)+'</button>'; }).join('')+'</div>';
  }

  h += '<label class="f">Fecha</label><input class="f" type="date" value="'+ADD.fecha+'" onchange="ADD.fecha=this.value">';
  h += '<label class="f">Nota (opcional)</label><input class="f" placeholder="Ej: mercado de la quincena" value="'+esc(ADD.nota)+'" oninput="ADD.nota=this.value">';

  h += '<button class="btn mt20" onclick="guardarMov()">'+(ADD.id?'Guardar cambios':'Listo')+'</button>';
  if(ADD.id) h += '<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarMov(\''+ADD.id+'\')">Eliminar</button>';

  sheet(ADD.id?'Editar movimiento':null, h);
}
function cambiarTipo(t){
  ADD.tipo=t;
  /* un ingreso o un ahorro ya no es el pago de esa cuota: se suelta el vinculo */
  if(t!=='out'){ ADD.ref=null; ADD.refMes=null; ADD.refNombre=''; }
  if(t==='out' && !CAT_MAP[ADD.cat]) ADD.cat='mercado';
  if(t==='in' && CATS.in.filter(function(c){return c.id===ADD.cat;}).length===0) ADD.cat='salario';
  if(t==='out' && CATS.out.filter(function(c){return c.id===ADD.cat;}).length===0) ADD.cat='mercado';
  renderAdd();
}
function tecla(k){
  if(k==='del') ADD.monto=ADD.monto.slice(0,-1);
  else if(k==='000'){ if(ADD.monto) ADD.monto=(ADD.monto+'000').slice(0,12); }
  else ADD.monto=(ADD.monto+k).replace(/^0+/,'').slice(0,12);
  var el=document.querySelector('.amount .v');
  if(el){ el.textContent='$'+(ADD.monto?fmtNum(+ADD.monto):'0'); el.classList.toggle('zero',!ADD.monto); }
}
function guardarMov(){
  var m=+ADD.monto||0;
  if(m<=0){ toast('Escribe un monto'); return; }
  if(ADD.tipo==='save' && ADD.retiro) m=-m;
  if(ADD.id){
    S.mov.forEach(function(x){
      if(x.id===ADD.id){
        if(x.ref) ajustarDeuda(x.ref, +(x.ab||0));            /* revierte el abono anterior */
        x.tipo=ADD.tipo; x.monto=m; x.cat=ADD.cat; x.destino=ADD.destino; x.fecha=ADD.fecha; x.nota=ADD.nota.trim();
        if(x.ref){ x.ab=abonoDe(x.ref,m); ajustarDeuda(x.ref, -x.ab); }
      }
    });
    toast('Cambios guardados ✓');
  }else{
    var nm={id:uid(), tipo:ADD.tipo, monto:m, cat:ADD.cat, destino:ADD.destino,
            fecha:ADD.fecha, nota:ADD.nota.trim(), creado:new Date().toISOString()};
    if(ADD.ref){
      nm.ref=ADD.ref; nm.refMes=ADD.refMes;
      nm.ab=abonoDe(ADD.ref,m);
      ajustarDeuda(ADD.ref, -nm.ab);
    }
    S.mov.push(nm);
    S.ajustes.movsDesdeRespaldo=(S.ajustes.movsDesdeRespaldo||0)+1;
    toast(ADD.ref ? 'Pago registrado ✓'
        : (ADD.tipo==='in'?'Ingreso registrado ✓':(ADD.tipo==='save'?'¡Bien! Ahorro registrado 🐾':'Gasto registrado ✓')));
  }
  cerrarSheet(); pintarTodo();
}
function editarMov(id){
  var m=S.mov.filter(function(x){ return x.id===id; })[0]; if(!m) return;
  abrirAdd(null,m);
}
function borrarMov(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  var vm=S.mov.filter(function(x){ return x.id===id; })[0];
  if(vm && vm.ref) ajustarDeuda(vm.ref, +(vm.ab||0));
  S.mov=S.mov.filter(function(x){ return x.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Eliminado');
}

/* =========================================================================
   PAGOS CON FECHA — cuotas de deuda y gastos fijos que vencen
   ========================================================================= */
function fechaDe(ym,dia){ return ym+'-'+pad(Math.min(Math.max(1,dia||1), diasEnMes(ym))); }
function deudaDe(id){ return S.deudas.filter(function(d){ return d.id===id; })[0]; }

/* el movimiento que salda ese compromiso en ese mes, si existe */
function pagoDe(id,ym){
  var r=null;
  S.mov.forEach(function(m){ if(m.ref===id && m.refMes===ym) r=m; });
  return r;
}

function compromisos(ym){
  var hoyD=new Date().getDate(), esteMes=(ym===ymHoy());
  var out=[];
  S.deudas.forEach(function(d){
    if(!(d.cuota>0) || !(d.dia>0)) return;
    out.push({id:d.id, nombre:d.nombre, monto:d.cuota, dia:d.dia, tipo:'deuda', cat:'deudas'});
  });
  S.fijos.forEach(function(f){
    if(!(f.monto>0) || !(f.dia>0)) return;
    out.push({id:f.id, nombre:f.nombre, monto:f.monto, dia:f.dia, tipo:'fijo', cat:f.cat||'otros_out'});
  });
  out.forEach(function(c){
    var mv=pagoDe(c.id,ym);
    c.pagado=!!mv; c.mov=mv;
    c.fecha=fechaDe(ym,c.dia);
    c.dias=c.dia-hoyD;
    if(c.pagado)          c.estado='pagado';
    else if(ym<ymHoy())   c.estado='vencido';
    else if(ym>ymHoy())   c.estado='futuro';
    else if(c.dia<hoyD)   c.estado='vencido';
    else if(c.dias<=5)    c.estado='proximo';
    else                  c.estado='pendiente';
  });
  out.sort(function(a,b){ return (a.pagado?1:0)-(b.pagado?1:0) || a.dia-b.dia; });
  return out;
}

/* ¿me alcanza para lo que viene? */
function prevision(ym){
  ym=ym||ymHoy();
  var lista=compromisos(ym);
  var pend=lista.filter(function(c){ return !c.pagado; });
  var porPagar=pend.reduce(function(a,c){ return a+c.monto; },0);
  var r=resumen(ym);
  var yaTengo=r.ing-r.gas-r.aho;
  /* al principio del mes el sueldo aún no ha caído: contarlo evita la falsa alarma */
  var refIng=S.perfil.ingresoEsperado || base().ing || 0;
  var porEntrar=Math.max(0, refIng-r.ing);
  var disponible=yaTengo+porEntrar;
  var hoyD=new Date().getDate();
  var prox=pend.length ? pend.slice().sort(function(a,b){ return a.dia-b.dia; })[0] : null;
  var dias=prox ? Math.max(1, prox.dia-hoyD) : 0;
  var falta=porPagar-disponible;
  return {lista:lista, pend:pend, porPagar:porPagar, disponible:disponible, falta:falta,
          yaTengo:yaTengo, porEntrar:porEntrar,
          prox:prox, dias:dias, porDia:(falta>0&&dias>0)?falta/dias:0,
          vencidos:pend.filter(function(c){ return c.estado==='vencido'; })};
}

/* dónde recortar para llegar: las categorías no esenciales más grandes */
function dondeRecortar(ym){
  var r=resumen(ym), top=[];
  Object.keys(r.porCat).forEach(function(k){
    var c=CAT_MAP[k]; if(c && !c.ess) top.push({c:c, v:r.porCat[k]});
  });
  top.sort(function(a,b){ return b.v-a.v; });
  return top.slice(0,3);
}

function compHTML(c, ym){
  var col = c.pagado ? 'var(--accent)'
          : c.estado==='vencido' ? 'var(--out)'
          : c.estado==='proximo' ? 'var(--warn)' : 'var(--muted)';
  var etq = c.pagado ? 'Pagado'
          : c.estado==='vencido' ? (ym<ymHoy() ? 'Quedó sin pagar' : (c.dias===0?'Vence hoy':'Venció el '+c.dia))
          : c.estado==='proximo' ? (c.dias===0?'Vence hoy':'Vence en '+c.dias+' día'+(c.dias>1?'s':''))
          : 'Vence el '+c.dia;
  return '<div class="pend'+(c.pagado?' ok':'')+'">'+
    '<div class="pd"><div class="nm">'+esc(c.nombre)+'</div>'+
    '<div class="dt" style="color:'+col+'">'+etq+(c.tipo==='deuda'?' · cuota':'')+'</div></div>'+
    '<div class="pa tnum">'+money(c.monto)+'</div>'+
    (c.pagado
      ? '<button class="pb done" onclick="editarMov(\''+c.mov.id+'\')" aria-label="Ver">✓</button>'
      : '<button class="pb" onclick="pagarCompromiso(\''+c.id+'\',\''+ym+'\')">Pagar</button>')+
  '</div>';
}

  var pagados=p.lista.filter(function(c){ return c.pagado; })

    (pagados>0?' · ya pagaste '+money(pagados):'')+'</div>'+
    '<div class="mt12">'+av+'</div>'+

/* bloque de pendientes dentro de la pantalla Movimientos */
function pendMesHTML(ym){
  var c=compromisos(ym).filter(function(x){ return !x.pagado; });
  if(!c.length) return '';
  var t=c.reduce(function(a,x){ return a+x.monto; },0);
  return '<div class="card"><h3>Pendientes de pagar</h3>'+
    '<div class="s13 muted" style="margin-bottom:2px">'+money(t)+' que todavía no registras en '+nomMes(ym)+'</div>'+
    c.map(function(x){ return compHTML(x, ym); }).join('')+'</div>';
}

/* registrar el pago: abre el teclado ya lleno y amarrado al compromiso */
function pagarCompromiso(id, ym){
  var c=compromisos(ym).filter(function(x){ return x.id===id; })[0];
  if(!c) return;
  ADD={tipo:'out', monto:String(Math.round(c.monto)), cat:c.cat, destino:'colchon',
       fecha:(ym===ymHoy()?hoyISO():c.fecha), nota:c.nombre, id:null, retiro:false,
       ref:c.id, refMes:ym, refNombre:c.nombre, refDia:c.dia, refTipo:c.tipo};
  renderAdd();
}

/* de la cuota, lo que de verdad baja la deuda (el resto son intereses) */
function abonoDe(id, monto){
  var d=deudaDe(id); if(!d) return 0;
  return Math.max(0, monto-interesMensual(d));
}
function ajustarDeuda(id, delta){
  var d=deudaDe(id); if(!d) return;
  d.saldo=Math.max(0, (d.saldo||0)+delta);
}

  var f = id ? S.fijos.filter(function(x){ return x.id===id; })[0] : null;
  var cats=CATS.out;
  var sel = f?f.cat:'arriendo';
  var h='<label class="f">¿Qué pago es?</label>'+
    '<input class="f" id="fNom" placeholder="Ej: arriendo" value="'+esc(f?f.nombre:'')+'">'+
    '<label class="f">¿Cuánto pagas cada mes?</label>'+

    '<label class="f">¿Qué día del mes vence?</label>'+

      cats.map(function(c){

          '<span class="e">'+c.e+'</span>'+esc(c.n)+'</button>'; }).join('')+'</div>'+

    (f?'<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarFijo(\''+id+'\')">Eliminar</button>':'');

function pickCat(b){

  b.classList.add('on');
}
function guardarFijo(id){
  var nom=(document.getElementById('fNom').value||'').trim();
  var mon=unfmt(document.getElementById('fMon').value);
  var dia=Math.max(0, Math.min(31, parseInt(String(document.getElementById('fDia').value).replace(/[^\d]/g,''),10)||0));
  var sel=document.querySelector('#fCat button.on');
  var cat=sel?sel.getAttribute('data-c'):'otros_out';

  if(mon<=0){ toast('¿Cuánto pagas?'); return; }
  if(!dia){ toast('¿Qué día vence?'); return; }
  if(id){ S.fijos.forEach(function(f){ if(f.id===id){ f.nombre=nom; f.monto=mon; f.dia=dia; f.cat=cat; } }); }
  else S.fijos.push({id:uid(), nombre:nom, monto:mon, dia:dia, cat:cat});

}
function borrarFijo(id){
  if(!confirm('¿Eliminar este pago fijo? Los pagos que ya registraste se quedan en tus movimientos.')) return;
  S.fijos=S.fijos.filter(function(f){ return f.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Eliminado');
}

function editarDeuda(id){
  var d = id ? S.deudas.filter(function(x){ return x.id===id; })[0] : null;
  var h='<label class="f">¿Qué deuda es?</label>'+
    '<input class="f" id="dNom" placeholder="Ej: tarjeta Bancolombia" value="'+esc(d?d.nombre:'')+'">'+

    '<label class="f">Cuota mensual (opcional)</label>'+
    '<input class="f tnum" id="dCuota" inputmode="numeric" placeholder="$0" value="'+(d&&d.cuota?fmtNum(d.cuota):'')+'" oninput="fmtIn(this)">'+
    '<label class="f">¿Qué día del mes vence? (opcional)</label>'+
    '<input class="f tnum" id="dDia" inputmode="numeric" placeholder="Ej: 15" value="'+(d&&d.dia?d.dia:'')+'">'+
    '<div class="s12 faint mt8">Si llenas estos dos, Mi Plata te avisa antes de que venza y te dice si te alcanza.</div>'+
    '<button class="btn mt20" onclick="guardarDeuda(\''+(id||'')+'\')">'+(d?'Guardar':'Agregar deuda')+'</button>'+
    (d?'<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarDeuda(\''+id+'\')">Ya la pagué / eliminar</button>':'');
  sheet(d?'Editar deuda':'Nueva deuda', h);
}
function guardarDeuda(id){
  var nom=(document.getElementById('dNom').value||'').trim();
  var sal=unfmt(document.getElementById('dSal').value);
  var tasa=+String(document.getElementById('dTasa').value||'').replace(',','.')||0;
  if(!nom){ toast('Ponle un nombre'); return; }
  if(sal<=0){ toast('¿Cuánto debes?'); return; }
  var cuo=unfmt((document.getElementById('dCuota')||{}).value||0);
  var dia=Math.max(0, Math.min(31, parseInt(String((document.getElementById('dDia')||{}).value||'').replace(/[^\d]/g,''),10)||0));
  if(id){ S.deudas.forEach(function(x){ if(x.id===id){ x.nombre=nom; x.saldo=sal; x.tasa=tasa; x.cuota=cuo; x.dia=dia; } }); }
  else S.deudas.push({id:uid(), nombre:nom, saldo:sal, tasa:tasa, cuota:cuo, dia:dia});
  cerrarSheet(); pintarTodo(); toast('Listo ✓');
}
function borrarDeuda(id){
  S.deudas=S.deudas.filter(function(x){ return x.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Deuda eliminada 🎉');
}

/* ---- perfil ---- */
function editarPerfil(){
  sheet('Mis datos',
    '<label class="f">¿Cuánto esperas ganar al mes? (opcional)</label>'+
    '<input class="f tnum" id="pIng" inputmode="numeric" placeholder="$0" value="'+(S.perfil.ingresoEsperado?fmtNum(S.perfil.ingresoEsperado):'')+'" oninput="fmtIn(this)">'+
    '<div class="s12 faint mt8">Sirve para calcular tu plan mientras acumulas historial. Después el app usa lo que de verdad entra.</div>'+
    '<button class="btn mt20" onclick="guardarPerfil()">Guardar</button>');
}
function guardarPerfil(){
  var elIng=document.getElementById('pIng');
  S.perfil.nombre='Salomé';
  if(elIng) S.perfil.ingresoEsperado=unfmt(elIng.value);
  S.perfil.onboarded=true;
  cerrarSheet(); pintarTodo(); toast('Guardado ✓');
}
